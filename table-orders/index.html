<style>
/* ===== 1. Brand primitives (from client/src/styles/tokens.css) ===== */
:root{
  color-scheme: light;

  --ok:var(--forest); --ok-tint:var(--forest-tint);
  --alert:var(--oxblood); --alert-tint:var(--oxblood-tint); --on-alert:var(--bone); --on-alert-2:var(--blush);

  --now:var(--ember); --now-text:var(--ember-ink);
  --inverse:var(--ink); --on-inverse:var(--bone); --on-inverse-2:var(--ash);

  --tone-neutral-bg:var(--sunken); --tone-neutral-fg:var(--text);

  --tone-alert-bg:var(--alert-tint); --tone-alert-fg:var(--alert);
  --tone-heat-bg:var(--heat-tint); --tone-heat-fg:var(--heat-text);
  --tone-ink-bg:var(--inverse); --tone-ink-fg:var(--on-inverse);
  --table-available-bg:var(--surface); --table-available-fg:var(--text-2);

  --font-num:var(--font-display);
  --num-features:"tnum" 1,"lnum" 1;

  --tone-alert-bg:var(--oxblood-night); --tone-alert-fg:var(--rose-light);
  --tone-heat-bg:var(--ember-night); --tone-heat-fg:var(--ember-light);
  --tone-ink-bg:var(--bone); --tone-ink-fg:var(--ink);

  --border-hair:1px solid var(--rule);
  --border-ctl:1px solid var(--edge);
  --border-ink:1px solid var(--rule-ink);

  --focus-ring:0 0 0 var(--focus-offset) var(--canvas), 0 0 0 calc(var(--focus-offset) + var(--focus-width)) var(--focus);
}

/* ===== Page dark theme. Rail stays --ink, so it still reads as a rail. ===== */

    --text:var(--bone); --text-2:var(--ash); --text-3:var(--ash-2); --numeral:var(--ash-2);
    --rule:rgba(248,244,234,.14); --rule-soft:rgba(248,244,234,.08); --rule-strong:rgba(248,244,234,.28);
    --rule-ink:var(--bone); --edge:var(--ash-2); --leader:var(--steel);
    --action:var(--forest); --action-hover:var(--forest-2); --on-action:var(--bone);
    --on-action-2:var(--sage); --action-text:var(--sage-light);
    --selected:var(--forest-night); --selected-edge:var(--sage-light);
    --ok:var(--sage-light); --ok-tint:var(--forest-night);
    --alert:var(--rose-light); --alert-tint:var(--oxblood-night); --on-alert:var(--bone); --on-alert-2:var(--blush);
    --heat-text:var(--ember-light); --heat-tint:var(--ember-night);
    --now:var(--ember); --now-text:var(--ember-light);
    --inverse:var(--bone); --on-inverse:var(--ink); --on-inverse-2:var(--ink-soft);
    --focus:var(--ember); --scrim:rgba(0,0,0,.66);
    --tone-neutral-bg:var(--ink-3); --tone-neutral-fg:var(--bone);
    --tone-ok-bg:var(--forest-night); --tone-ok-fg:var(--sage-light);
    --tone-alert-bg:var(--oxblood-night); --tone-alert-fg:var(--rose-light);
    --tone-heat-bg:var(--ember-night); --tone-heat-fg:var(--ember-light);
    --tone-ink-bg:var(--bone); --tone-ink-fg:var(--ink);
    --table-available-bg:var(--surface); --table-available-fg:var(--text-2);
    --table-dining-bg:var(--ink); --table-dining-fg:var(--bone); --table-dining-fg-2:var(--ash);
    --table-checkout-bg:var(--surface); --table-checkout-edge:var(--sage-light); --table-checkout-fg:var(--sage-light);
    --table-disabled-bg:var(--smoke); --table-disabled-fg:var(--text-2);

  }
}

<style>
/* ===== Base ===== */
*,*::before,*::after{ box-sizing:border-box; }
body{ background:var(--canvas); color:var(--text); font:var(--fw-regular,400) var(--fs-15)/var(--lh-thai) var(--font-ui); -webkit-text-size-adjust:100%; }
h1,h2,h3,h4,p,ul,ol,figure{ margin:0; padding:0; }
ul,ol{ list-style:none; }
button{ font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
input{ font:inherit; color:inherit; }
:focus-visible{ outline:none; box-shadow:var(--focus-ring); border-radius:var(--radius-sm); }
.vh{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.num{ font-family:var(--font-num); font-feature-settings:var(--num-features); font-variant-numeric:tabular-nums lining-nums; }

/* ===== Shell ===== */
.app{ display:flex; min-height:100vh; align-items:stretch; }
.rail{
  flex:0 0 var(--rail-w); width:var(--rail-w); background:var(--canvas); color:var(--text);
  display:flex; flex-direction:column; position:sticky; top:0; align-self:flex-start;
  height:100vh; padding:var(--space-5) 0 var(--space-4);
}
.brand{ padding:0 var(--space-5) var(--space-6); }
.brand-w{ font:600 var(--fs-16)/1 var(--font-serif); letter-spacing:.18em; text-transform:uppercase; display:block; }
.brand-l{ font:500 var(--fs-12)/1 var(--font-display); letter-spacing:var(--track-lockup); text-transform:uppercase; color:var(--now-text); display:block; margin-top:6px; }
.nav{ display:flex; flex-direction:column; gap:2px; padding:0 var(--space-3); }
.nav-b{
  display:flex; align-items:center; gap:var(--space-3); width:100%; min-height:var(--tap-staff);
  padding:0 var(--space-3); border-radius:var(--radius-ctl); color:var(--text-2);
  font:500 var(--fs-15)/1.2 var(--font-ui); text-align:left; transition:background var(--dur-fast), color var(--dur-fast);
}
.nav-b:hover{ background:var(--hover); color:var(--text); }
.nav-b[aria-current="page"]{ background:var(--surface); color:var(--text); font-weight:600; box-shadow:inset 3px 0 0 var(--now); }
.nav-b .ic{ flex:0 0 auto; opacity:.9; }
.nav-b .cnt{
  margin-left:auto; min-width:22px; height:22px; padding:0 7px; border-radius:var(--radius-pill);
  background:var(--now); color:var(--ink); display:inline-flex; align-items:center; justify-content:center;
  font:600 var(--fs-13)/1 var(--font-num); font-feature-settings:var(--num-features);
}
.rail-foot{ margin-top:auto; padding:var(--space-4) var(--space-5) 0; border-top:var(--border-hair); margin-left:var(--space-3); margin-right:var(--space-3); }
.seg{ display:inline-flex; border:var(--border-ctl); border-radius:var(--radius-ctl); overflow:hidden; background:var(--canvas); }
.seg button{ padding:7px 11px; font:500 var(--fs-13)/1.2 var(--font-ui); color:var(--text-2); min-height:34px; }
.seg button[aria-pressed="true"]{ background:var(--inverse); color:var(--on-inverse); font-weight:600; }
.seg button + button{ border-left:var(--border-hair); }
.rail-meta{ margin-top:var(--space-4); font:400 var(--fs-13)/1.5 var(--font-ui); color:var(--text-3); }

/* ===== Main ===== */
.main{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; background:var(--canvas); }
.topbar{
  position:sticky; top:0; z-index:var(--z-sticky); background:var(--canvas);
  display:flex; align-items:center; gap:var(--space-4); flex-wrap:wrap;
  padding:var(--space-4) var(--gutter); border-bottom:var(--border-hair);
}
.page-t{ font:italic 600 var(--fs-28)/1 var(--font-serif); margin-right:var(--space-1); }
.chip-demo{
  font:500 var(--fs-12)/1 var(--font-display); letter-spacing:var(--track-caps); text-transform:uppercase;
  border:var(--border-ink); padding:6px 9px; border-radius:var(--radius-hair); color:var(--text);
}
.live{ display:inline-flex; align-items:center; gap:7px; font:var(--fs-13)/1.2 var(--font-ui); color:var(--text-2); margin-left:auto; }
.live .dot{ width:8px; height:8px; border-radius:50%; background:var(--ok); flex:0 0 auto; }
.live[data-paused="true"] .dot{ background:var(--heat-text); }
.live b{ color:var(--text); font-weight:600; }
.who{ display:flex; align-items:center; gap:var(--space-2); padding-left:var(--space-4); border-left:var(--border-hair); }
.avatar{ width:36px; height:36px; border-radius:50%; background:var(--forest); color:var(--bone); display:grid; place-items:center; font:600 var(--fs-13)/1 var(--font-display); letter-spacing:.04em; }
.who-n{ font:600 var(--fs-14)/1.3 var(--font-ui); }
.who-r{ font:400 var(--fs-13)/1.3 var(--font-ui); color:var(--text-2); }

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:var(--space-2);
  min-height:var(--control-h); padding:0 var(--space-4); border-radius:var(--radius-ctl);
  font:600 var(--fs-15)/1.2 var(--font-ui); border:var(--border-ctl); color:var(--text);
  background:var(--surface); transition:background var(--dur-fast), transform var(--dur-fast);
}
.btn:hover{ background:var(--hover); }
.btn:active{ transform:scale(var(--press-scale)); }
.btn-pri{ background:var(--action); color:var(--on-action); border-color:var(--action); min-height:var(--control-h-staff); }
.btn-pri:hover{ background:var(--action-hover); }
.btn-lg{ min-height:var(--control-h-staff); }
.btn-sm{ min-height:34px; padding:0 var(--space-3); font-size:var(--fs-13); font-weight:500; }
.btn-blocked{ background:var(--sunken); color:var(--text-3); border-color:var(--rule); cursor:not-allowed; }
.btn-blocked:hover{ background:var(--sunken); }
.btn-link{ border:0; background:none; padding:0; min-height:var(--control-h); color:var(--action-text); font:500 var(--fs-14)/1.2 var(--font-ui); text-decoration:underline; text-underline-offset:3px; }
.btn-ghost{ border:0; background:none; color:var(--text-2); }
.btn-ghost:hover{ background:var(--hover); color:var(--text); }

.panel{ padding:var(--space-6) var(--gutter) var(--space-10); min-width:0; }
.sec-h{ display:flex; align-items:baseline; gap:var(--space-3); flex-wrap:wrap; margin-bottom:var(--space-4); }
.sec-t{ font:600 var(--fs-22)/1.3 var(--font-ui); }
.sec-s{ font:400 var(--fs-14)/1.5 var(--font-ui); color:var(--text-2); }
.kicker{ font:500 var(--fs-12)/1.2 var(--font-display); letter-spacing:var(--track-caps); text-transform:uppercase; color:var(--text-3); }

/* ===== Overview ===== */
.cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:var(--space-3); }
.card{ background:var(--surface); border:var(--border-hair); border-radius:var(--radius-card); padding:var(--space-4); box-shadow:var(--shadow-card); display:flex; flex-direction:column; min-width:0; }
.card-t{ display:flex; align-items:center; gap:var(--space-2); font:600 var(--fs-15)/1.3 var(--font-ui); }
.card-n{ font:500 var(--fs-40)/1 var(--font-num); font-feature-settings:var(--num-features); margin:var(--space-3) 0 var(--space-2); }
.card-n.zero{ color:var(--text-3); }
.card-s{ font:400 var(--fs-13)/1.5 var(--font-ui); color:var(--text-2); flex:1 1 auto; }

/* ===== Board ===== */

.board{ display:grid; grid-auto-flow:column; grid-auto-columns:minmax(var(--board-col-min),1fr); gap:var(--space-3); overflow-x:auto; padding-bottom:var(--space-3); scrollbar-width:thin; }

.allergy{ background:var(--allergy-bg); color:var(--allergy-fg); padding:var(--space-3) var(--ticket-pad); }

.t-lines{ padding:0 var(--ticket-pad); }

.t-dish{ min-width:0; flex:1 1 auto; }
.d-th{ font:600 var(--fs-15)/var(--lh-thai-min) var(--font-ui); overflow-wrap:anywhere; }
.d-en{ font:italic 500 var(--fs-14)/1.3 var(--font-serif); color:var(--text-2); margin-top:2px; }
.d-meta{ font:400 var(--fs-13)/1.4 var(--font-ui); color:var(--text-3); margin-top:3px; }
.d-st{ display:flex; align-items:center; gap:6px; font:400 var(--fs-13)/1.4 var(--font-ui); color:var(--text-2); margin-top:5px; }

.d-st.heat{ color:var(--heat-text); }

/* ===== Requests ===== */
.cols2{ display:grid; grid-template-columns:1fr; gap:var(--space-6); align-items:start; }

.gram{ display:flex; align-items:center; gap:var(--space-2); border:var(--border-ctl); border-radius:var(--radius-ctl); background:var(--surface); padding:0 var(--space-3); min-height:var(--control-h-staff); }
.gram input{ border:0; background:none; outline:none; width:100%; min-width:0; font:500 var(--fs-24)/1 var(--font-num); font-feature-settings:var(--num-features); padding:8px 0; }
.gram span{ color:var(--text-2); font-size:var(--fs-15); }
.calc{ margin-top:var(--space-3); font:400 var(--fs-14)/1.5 var(--font-ui); color:var(--text-2); }

/* ===== Tables ===== */
.floor{ display:grid; grid-template-columns:repeat(auto-fill,minmax(168px,1fr)); gap:var(--space-3); }

.tile-free{ background:var(--table-available-bg); border:1px dashed var(--edge); color:var(--table-available-fg); }
.tile-dining{ background:var(--table-dining-bg); border:1px solid var(--table-dining-bg); color:var(--table-dining-fg); }
.tile-checkout{ background:var(--table-checkout-bg); border:2px solid var(--table-checkout-edge); }

.tile[aria-pressed="true"]{ box-shadow:0 0 0 2px var(--now); }
.tile-n{ font:500 var(--fs-32)/1 var(--font-num); font-feature-settings:var(--num-features); }
.tile-st{ font:600 var(--fs-15)/1.3 var(--font-ui); margin-top:var(--space-2); display:flex; align-items:center; gap:6px; }

.tile-foot{ margin-top:auto; padding-top:var(--space-3); font:500 var(--fs-13)/1.2 var(--font-ui); color:inherit; display:flex; align-items:center; gap:6px; opacity:.9; }
.tile-badges{ position:absolute; top:var(--space-3); right:var(--space-3); display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; max-width:60%; }
.bdg{ font:600 var(--fs-12)/1 var(--font-display); letter-spacing:var(--track-caps); text-transform:uppercase; padding:4px 6px; border-radius:var(--radius-hair); }
.bdg-new{ background:var(--inverse); color:var(--on-inverse); }
.tile-dining .bdg-new{ background:var(--bone); color:var(--ink); }
.bdg-call{ background:var(--oxblood); color:var(--bone); }
.bdg-ready{ background:var(--ember); color:var(--ink); }

.bdg-off{ background:transparent; color:var(--text-3); border:1px solid var(--rule); }

/* ===== Drawer ===== */
.scrim{ position:fixed; inset:0; background:var(--scrim); z-index:var(--z-drawer); }
.drawer{
  position:fixed; top:0; right:0; bottom:0; width:min(var(--drawer-w),100%);
  background:var(--canvas); z-index:var(--z-sheet); box-shadow:var(--shadow-drawer);
  display:flex; flex-direction:column; animation:slide var(--dur-sheet) var(--ease-out);
}
@keyframes slide{ from{ transform:translateX(24px); opacity:0; } }
.dw-h{ display:flex; gap:var(--space-3); align-items:flex-start; padding:var(--space-4) var(--space-4) var(--space-3); border-bottom:var(--border-hair); }
.dw-t{ font:600 var(--fs-22)/1.3 var(--font-ui); display:flex; align-items:center; gap:var(--space-2); flex-wrap:wrap; }

.bill-r.total{ border-top:var(--border-ink); font-weight:600; font-size:var(--fs-16); padding-top:var(--space-3); }
.bill-r .money{ font-family:var(--font-num); font-feature-settings:var(--num-features); }
.blockers{ background:var(--alert-tint); border-left:3px solid var(--alert); border-radius:var(--radius-sm); padding:var(--space-3); margin-bottom:var(--space-3); }
.blockers h4{ display:flex; align-items:center; gap:7px; font:600 var(--fs-15)/1.4 var(--font-ui); color:var(--alert); }

.blockers li::before{ content:""; position:absolute; left:2px; top:.62em; width:5px; height:5px; border-radius:50%; background:var(--alert); }
.clearbox{ background:var(--ok-tint); border-left:3px solid var(--ok); border-radius:var(--radius-sm); padding:var(--space-3); margin-bottom:var(--space-3); display:flex; gap:7px; align-items:center; font:500 var(--fs-14)/1.5 var(--font-ui); color:var(--ok); }
.warnbox{ display:flex; gap:7px; font:400 var(--fs-13)/1.5 var(--font-ui); color:var(--heat-text); margin-bottom:var(--space-3); }

/* ===== Toasts ===== */
.toasts{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(16px + env(safe-area-inset-bottom,0px)); z-index:var(--z-toast); display:flex; flex-direction:column; gap:var(--space-2); width:min(420px,calc(100% - 32px)); }
.toast{ background:var(--inverse); color:var(--on-inverse); border-radius:var(--radius-ctl); padding:var(--space-3) var(--space-4); box-shadow:var(--shadow-toast); font:500 var(--fs-14)/1.5 var(--font-ui); animation:arrive var(--dur-base) var(--ease-out); }
.toast.alert{ background:var(--allergy-bg); color:var(--allergy-fg); }

/* ===== Narrow ===== */
@media(max-width:1023px){
  .app{ flex-direction:column; }

  .rail-foot{ display:flex; align-items:center; gap:var(--space-3); flex-wrap:wrap; padding:var(--space-3) var(--gutter); margin:0; }

}

  .board{ display:block; }

  .board[data-only="new"] .col[data-col="new"],
  .board[data-only="accepted"] .col[data-col="accepted"],
  .board[data-only="preparing"] .col[data-col="preparing"],

  .picker{ display:flex; gap:var(--space-2); overflow-x:auto; padding-bottom:var(--space-2); margin-bottom:var(--space-3); }
  .picker button{ flex:0 0 auto; border:var(--border-ctl); border-radius:var(--radius-ctl); padding:9px var(--space-3); background:var(--surface); font:500 var(--fs-13)/1.2 var(--font-ui); display:flex; gap:6px; align-items:center; white-space:nowrap; min-height:44px; }

  .page-t{ font-size:var(--fs-24); }
  .who-n,.who-r{ display:none; }

}
@media(max-width:479px){
  .floor{ grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); }
  .cards{ grid-template-columns:1fr 1fr; }
  .card-n{ font-size:var(--fs-32); }
  .tally > div{ flex:1 1 70px; }
}

<div class="app">

  </main>
</div>
<div id="drawerRoot"></div>

/* ============ small helpers ============ */
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function pad2(n){ return (n<10?'0':'') + n; }
function baht(sat){
  var neg = sat < 0; sat = Math.abs(Math.round(sat));
  var whole = Math.floor(sat/100), frac = sat % 100;
  var s = String(whole).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg?'-':'') + '฿' + s + (frac ? ('.' + pad2(frac)) : '');
}
var BASE = Date.UTC(2026, 9, 5, 15, 55, 0);   /* 22:55 Asia/Bangkok, Mon 5 Oct 2026 */
var T0 = Date.now();
function now(){ return BASE + (Date.now() - T0); }
function clock(ms){ var d = new Date(ms + 7*3600*1000); return pad2(d.getUTCHours()) + ':' + pad2(d.getUTCMinutes()); }
function mins(ms){ return Math.max(0, Math.floor((now() - ms)/60000)); }
function dur(ms){
  var m = mins(ms);
  if (m < 60) return m + ' ' + t('minShort');
  return Math.floor(m/60) + ' ' + t('hShort') + ' ' + pad2(m%60);
}

      askedAbout: 450, quoteNo: 1, quotedAt: ago(4) },

/* ============ derived ============ */
function tableOf(n){ for (var i=0;i<state.tables.length;i++) if (state.tables[i].n === n) return state.tables[i]; return null; }
function liveTickets(){ return state.tickets.filter(function(x){ return x.col !== 'served'; }); }
function ticketsFor(n){ return state.tickets.filter(function(x){ return x.table === n; }); }
function openUnits(tk){
  var s = 0; tk.lines.forEach(function(l){ if (l.st !== 'served') s += l.qty; }); return s;
}
function unservedFor(n){
  var s = 0; ticketsFor(n).forEach(function(tk){ s += openUnits(tk); }); return s;
}
function lineSat(l){
  if (l.sat != null) return l.sat;
  var it = ITEM[l.item];
  return (it && it.price ? it.price : 0) * l.qty;
}
function billSat(n){
  var s = 0;
  ticketsFor(n).forEach(function(tk){ tk.lines.forEach(function(l){ s += lineSat(l); }); });
  return s;
}
function openRequests(n){
  return state.requests.filter(function(r){ return n == null || r.table === n; });
}
function openWeighs(n){
  return state.weighs.filter(function(w){ return (w.status === 'to_weigh' || w.status === 'quoted') && (n == null || w.table === n); });
}
function readyUnits(n){
  var s = 0;
  state.tickets.forEach(function(tk){
    if (tk.col === 'ready' && (n == null || tk.table === n)) s += openUnits(tk);
  });
  return s;
}
function blockersFor(tb){
  var out = [];
  var un = ticketsFor(tb.n).filter(function(tk){ return openUnits(tk) > 0; });
  un.forEach(function(tk){ out.push(t('blkUnserved', { n: openUnits(tk), r: tk.round })); });
  if (!tb.checkoutStarted) out.push(t('blkNotStarted'));
  if (!tb.paid) out.push(t('blkNoPay', { m: baht(billSat(tb.n)) }));
  return out;
}

function lineState(tk, l){

function stationsOf(tk){
  var set = {};
  tk.lines.forEach(function(l){ var it = ITEM[l.item]; if (it) set[it.station] = 1; });

}

/* ============ board ============ */
function matchesQ(tk){
  var q = state.q.trim().toLowerCase();
  if (!q) return true;
  if (tk.ref.toLowerCase().indexOf(q) >= 0) return true;
  if (String(tk.table).indexOf(q) >= 0 || pad2(tk.table).indexOf(q) >= 0) return true;
  for (var i=0;i<tk.lines.length;i++){
    var it = ITEM[tk.lines[i].item]; if (!it) continue;
    if ((it.en || '').toLowerCase().indexOf(q) >= 0) return true;
    if (it.th && it.th.indexOf(state.q.trim()) >= 0) return true;
  }
  return false;
}
function matchesStation(tk){
  if (state.station === 'all') return true;
  return stationsOf(tk).indexOf(state.station) >= 0;
}
function renderBoard(){
  var shown = liveTickets().filter(function(tk){ return matchesQ(tk) && matchesStation(tk); })
                           .sort(function(a,b){ return a.sentAt - b.sentAt; });
  var counts = {};
  COLS.forEach(function(c){ counts[c] = shown.filter(function(tk){ return tk.col === c; }).length; });

  var h = '<div class="toolbar">';
  h += '<div class="seg" role="group" aria-label="'+esc(t('allStations'))+'">'+
       [['all','allStations'],['kitchen','kitchen'],['bar','bar']].map(function(x){
         var n = x[0] === 'all' ? liveTickets().length
                : liveTickets().filter(function(tk){ return stationsOf(tk).indexOf(x[0]) >= 0; }).length;
         return '<button type="button" data-act="station" data-v="'+x[0]+'" aria-pressed="'+(state.station===x[0])+'">'+
                esc(t(x[1]))+' <span class="num" style="opacity:.7">'+n+'</span></button>';
       }).join('')+'</div>';
  h += '<label class="search">'+ic('search',16)+
       '<span class="vh">'+esc(t('searchPh'))+'</span>'+
       '<input type="search" id="q" value="'+esc(state.q)+'" placeholder="'+esc(t('searchPh'))+'" autocomplete="off"></label>';
  h += '</div>';

  h += '<div class="picker" role="group">'+COLS.map(function(c){
    return '<button type="button" data-act="onlyCol" data-v="'+c+'" aria-pressed="'+(state.onlyCol===c)+'">'+
           esc(t(COLNAME[c]))+'<span class="num">'+counts[c]+'</span></button>';
  }).join('')+'</div>';

  h += '<div class="board" data-only="'+state.onlyCol+'">';
  COLS.forEach(function(c){
    var subKey = c === 'new' ? 'colNewSub' : (c === 'almost' ? 'colAlmostSub' : (c === 'ready' ? 'colReadySub' : null));
    h += '<section class="col" data-col="'+c+'" aria-label="'+esc(t(COLNAME[c]))+'">';
    h += '<header class="col-h"><span class="col-n">'+esc(t(COLNAME[c]))+'</span>'+
         '<span class="col-c num">'+counts[c]+'</span>'+
         (subKey ? '<span class="col-s">'+esc(t(subKey))+'</span>' : '')+'</header>';
    var list = shown.filter(function(tk){ return tk.col === c; });
    if (!list.length) h += '<p class="col-empty">'+esc(state.q || state.station !== 'all' ? t('boardNone') : t('colEmpty'))+'</p>';
    list.forEach(function(tk){ h += ticketHTML(tk); });
    h += '</section>';
  });
  h += '</div>';
  return h;
}

/* ============ tables ============ */
function badgesFor(tb){
  var out = [];
  if (tb.st === 'disabled'){ return [['off', t('stOff')]]; }
  var tks = ticketsFor(tb.n);
  if (tks.some(function(x){ return x.col === 'new'; })) out.push(['new', lang==='th'?'ใหม่':'New']);
  var rq = openRequests(tb.n);
  if (rq.some(function(r){ return r.kind !== 'bill'; })) out.push(['call', lang==='th'?'เรียก':'Call']);
  if (rq.some(function(r){ return r.kind === 'bill'; }) || tb.st === 'checkout') out.push(['bill', lang==='th'?'บิล':'Bill']);
  var ru = readyUnits(tb.n);
  if (ru) out.push(['ready', (lang==='th'?'พร้อม ':'Ready ') + ru]);
  if (openWeighs(tb.n).length) out.push(['quote', lang==='th'?'ชั่ง':'Quote']);
  return out.slice(0, 3);
}
function needsAttention(tb){
  if (tb.st === 'disabled' || tb.st === 'free') return false;
  return badgesFor(tb).length > 0;
}

/* ============ render ============ */
var VIEWS = { overview: renderOverview, orders: renderBoard, requests: renderRequests, tables: renderTables };
function render(){
  var panel = document.getElementById('panel');
  var y = window.scrollY, track = panel.querySelector('.board'), x = track ? track.scrollLeft : 0;
  renderChrome();
  panel.innerHTML = VIEWS[state.tab]();
  var nt = panel.querySelector('.board'); if (nt) nt.scrollLeft = x;
  window.scrollTo(0, y);
  renderDrawer();
  tickTimers();
}
function tickTimers(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-since]'), function(el){
    el.textContent = mins(+el.getAttribute('data-since'));
  });
  var lb = document.getElementById('liveBox');
  if (lb && !state.paused){
    var s = lb.querySelector('span:last-child');
    if (s) s.textContent = t('synced', { t: clock(now()) });
  }
}
function toast(msg, kind){
  var box = document.getElementById('toasts');
  var el = document.createElement('p');
  el.className = 'toast' + (kind === 'alert' ? ' alert' : '');
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 4200);
}
function announce(msg){ document.getElementById('announce').textContent = msg; }

/* ============ actions ============ */
function ticketById(id){ for (var i=0;i<state.tickets.length;i++) if (state.tickets[i].id === id) return state.tickets[i]; return null; }
function weighById(id){ for (var i=0;i<state.weighs.length;i++) if (state.weighs[i].id === id) return state.weighs[i]; return null; }

function advance(id){
  var tk = ticketById(id); if (!tk) return;
  var i = COLS.indexOf(tk.col);
  if (tk.col === 'ready'){
    tk.lines.forEach(function(l){ if (l.st !== 'served'){ l.st = 'served'; l.at = now(); } });
    tk.col = 'served';
    toast(t('servedToast', { ref: tk.ref }));
    render(); return;
  }
  if (tk.col === 'preparing' || tk.col === 'almost'){
    tk.col = 'ready';
    tk.lines.forEach(function(l){ if (l.st !== 'served'){ l.st = 'ready'; l.at = now(); } });
  } else {
    tk.col = COLS[i+1];
    if (tk.col === 'preparing') tk.lines.forEach(function(l){ if (l.st !== 'served') l.st = 'pending'; });
  }
  delete state.newIds[tk.id];
  toast(t('movedTo', { ref: tk.ref, col: t(COLNAME[tk.col]) }));
  render();
}
function setAlmost(id){
  var tk = ticketById(id); if (!tk || tk.col !== 'preparing') return;
  tk.col = 'almost';
  toast(t('movedTo', { ref: tk.ref, col: t('colAlmost') }));
  render();
}
function newArrival(){
  var dining = state.tables.filter(function(tb){ return tb.st === 'dining'; });
  if (!dining.length) return;
  var tb = pick(dining);
  var station = Math.random() < 0.72 ? 'kitchen' : 'bar';
  var pool = POOL[station].slice();
  var n = 2 + Math.floor(Math.random()*3), lines = [];
  for (var i=0;i<n && pool.length;i++){
    var k = Math.floor(Math.random()*pool.length);
    lines.push({ item: pool[k].id, qty: Math.random() < 0.72 ? 1 : 2, st: 'pending' });
    pool.splice(k,1);
  }
  var rounds = ticketsFor(tb.n).length;
  var tk = { id: uid('tk'), ref: mkRef(), table: tb.n, round: rounds + 1, col: 'new',
             sentAt: now(), station: station, lines: lines, allergy: null, takenBy: null };
  if (Math.random() < 0.3) tk.allergy = pick(ALLERGY_NOTES);
  state.tickets.push(tk);
  state.newIds[tk.id] = 1;
  setTimeout(function(){ delete state.newIds[tk.id]; }, 6000);
  announce(t('arrived', { n: tb.n }));
  toast(t('arrived', { n: pad2(tb.n) }), tk.allergy ? 'alert' : null);
  render();
}
/* Guest-typed notes. Shown exactly as typed — never translated, never corrected. */
var ALLERGY_NOTES = [
  'แพ้อาหารทะเล ขอไม่ใส่กุ้งนะคะ',
  'no shellfish please, my son is allergic',
  'lactose intolerant - no cream if possible',
  'แพ้กลูเตน gluten free ได้ไหมคะ',
  'severe peanut allergy. please check the sauce'
];

function ackRequest(id){
  state.requests.forEach(function(r){
    if (r.id === id && r.status !== 'ack'){ r.status = 'ack'; r.by = 'Demo Owner'; r.at = now(); }
  });
  render();
}
function doneRequest(id){
  var r = null;
  state.requests = state.requests.filter(function(x){ if (x.id === id){ r = x; return false; } return true; });
  if (r) toast(t('reqDone', { n: pad2(r.table) }));
  render();
}
function sendQuote(id){
  var w = weighById(id); if (!w || !state.weighForm || state.weighForm.id !== id) return;
  var g = parseInt(state.weighForm.grams, 10);
  if (!(g > 0)){ toast(t('enterGrams'), 'alert'); return; }
  w.grams = g; w.status = 'quoted'; w.quoteNo = state.quoteSeq++; w.quotedAt = now();
  state.weighForm = null;
  toast(t('quoteSent', { m: baht(quoteSat(g)), n: pad2(w.table) }));
  render();
}
function confirmCut(id){
  var w = weighById(id); if (!w || w.status !== 'quoted') return;
  w.status = 'confirmed';
  var rounds = ticketsFor(w.table).length;
  state.tickets.push({
    id: uid('tk'), ref: mkRef(), table: w.table, round: rounds + 1, col: 'new', sentAt: now(),
    station: 'kitchen', allergy: null, takenBy: 'Demo Owner',
    lines: [{ item: w.item, qty: 1, st: 'pending', grams: w.grams, sat: quoteSat(w.grams) }]
  });
  toast(t('cutConfirmed'));
  render();
}
function openTable(n){ state.drawer = n; state.tab = state.tab; render(); }
function closeDrawer(){ state.drawer = null; render(); }

function startCheckout(n){
  var tb = tableOf(n); if (!tb || tb.st === 'free' || tb.st === 'disabled') return;
  tb.checkoutStarted = true; tb.st = 'checkout';
  toast(t('toastStart', { n: pad2(n) }));
  render();
}
function markPaid(n){
  var tb = tableOf(n); if (!tb || !tb.checkoutStarted) return;
  tb.paid = true;
  toast(t('toastPaid', { n: pad2(n), m: baht(billSat(n)) }));
  render();
}
function completeCheckout(n){
  var tb = tableOf(n); if (!tb) return;
  var blk = blockersFor(tb);
  if (blk.length){ toast(t('blockedToast', { r: blk[0] }), 'alert'); return; }
  state.tickets = state.tickets.filter(function(tk){ return tk.table !== n; });
  state.requests = state.requests.filter(function(r){ return r.table !== n; });
  state.weighs = state.weighs.filter(function(w){ return w.table !== n; });
  tb.st = 'free'; tb.seatedAt = null; tb.covers = 0; tb.paid = false; tb.checkoutStarted = false;
  state.drawer = null;
  toast(t('toastDone', { n: pad2(n) }));
  render();
}
function seatTable(n){
  var tb = tableOf(n); if (!tb || tb.st !== 'free') return;
  tb.st = 'dining'; tb.seatedAt = now(); tb.covers = 2 + Math.floor(Math.random()*4);
  tb.paid = false; tb.checkoutStarted = false;
  toast(t('toastSeat', { n: pad2(n) }));
  render();
}
function setEnabled(n, on){
  var tb = tableOf(n); if (!tb) return;
  if (!on && tb.st !== 'free') return;
  tb.st = on ? 'free' : 'disabled';
  toast(t(on ? 'toastEnabled' : 'toastDisabled', { n: pad2(n) }));
  render();
}

/* ============ events ============ */
document.addEventListener('click', function(ev){
  var el = ev.target.closest ? ev.target.closest('[data-act]') : null;
  if (!el) return;
  var a = el.getAttribute('data-act'), v = el.getAttribute('data-v');
  switch (a){
    case 'tab': state.tab = v; state.weighForm = null; render(); break;
    case 'lang': lang = v; store('lang', v); render(); break;
    case 'theme':
      state.theme = v; store('theme', v);
      if (v === 'auto') document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', v);
      render(); break;
    case 'pause': state.paused = !state.paused; render(); break;
    case 'station': state.station = v; render(); break;
    case 'onlyCol': state.onlyCol = v; render(); break;
    case 'tfilter': state.tableFilter = v; render(); break;
    case 'gotoCol': state.tab = 'orders'; state.onlyCol = v; state.station = 'all'; render(); break;
    case 'advance': advance(el.getAttribute('data-tk')); break;
    case 'almost': setAlmost(el.getAttribute('data-tk')); break;
    case 'ack': ackRequest(el.getAttribute('data-rq')); break;
    case 'done': doneRequest(el.getAttribute('data-rq')); break;
    case 'weighopen':
      var w0 = weighById(el.getAttribute('data-wg'));
      state.weighForm = { id: el.getAttribute('data-wg'), grams: w0 && w0.grams ? String(w0.grams) : '' };
      render();
      var gi = document.getElementById('gramInput'); if (gi){ gi.focus(); gi.select(); }
      break;
    case 'weighclose': state.weighForm = null; render(); break;
    case 'quote': sendQuote(el.getAttribute('data-wg')); break;
    case 'cutconfirm': confirmCut(el.getAttribute('data-wg')); break;
    case 'opentable': openTable(+el.getAttribute('data-n')); break;
    case 'closedrawer': closeDrawer(); break;
    case 'startco': startCheckout(+el.getAttribute('data-n')); break;
    case 'pay': markPaid(+el.getAttribute('data-n')); break;
    case 'completeco': completeCheckout(+el.getAttribute('data-n')); break;
    case 'seat': seatTable(+el.getAttribute('data-n')); break;
    case 'enable': setEnabled(+el.getAttribute('data-n'), true); break;
    case 'disable': setEnabled(+el.getAttribute('data-n'), false); break;
  }
});
document.addEventListener('input', function(ev){
  if (ev.target.id === 'q'){ state.q = ev.target.value; var sel = ev.target.selectionStart; render();
    var q2 = document.getElementById('q'); if (q2){ q2.focus(); try{ q2.setSelectionRange(sel, sel); }catch(e){} } }
  if (ev.target.id === 'gramInput' && state.weighForm){
    state.weighForm.grams = ev.target.value;
    var card = ev.target.closest('.weigh-form');
    if (card){
      var w = weighById(state.weighForm.id), g = parseInt(ev.target.value, 10);
      var calc = card.querySelector('.calc');
      var btn = card.querySelector('[data-act="quote"]');
      if (calc) calc.innerHTML = g > 0
        ? esc(t('calcLine', { g: g, p: Math.round(PRIME.rate/100), b: PRIME.basis })) + '<b>' + baht(quoteSat(g)) + '</b>'
        : esc(t('enterGrams'));
      if (btn) btn.className = 'btn btn-pri' + (g > 0 ? '' : ' btn-blocked');
    }
  }
});
document.addEventListener('keydown', function(ev){
  if (ev.key === 'Escape'){
    if (state.weighForm){ state.weighForm = null; render(); }
    else if (state.drawer != null) closeDrawer();
  }
  if (ev.key === 'Enter' && ev.target.id === 'gramInput' && state.weighForm){
    ev.preventDefault(); sendQuote(state.weighForm.id);
  }
});

/* ============ clocks ============ */
var arrivalTimer = null;
function scheduleArrival(){
  if (arrivalTimer) clearTimeout(arrivalTimer);
  var wait = 15000 + Math.random()*25000;
  arrivalTimer = setTimeout(function(){
    if (!state.paused && state.drawer == null) newArrival();
    scheduleArrival();
  }, wait);
}
setInterval(tickTimers, 1000);

/* ============ boot ============ */
(function boot(){
  var savedLang = store('lang'); if (savedLang === 'th' || savedLang === 'en') lang = savedLang;
  var savedTheme = store('theme');
  if (savedTheme === 'light' || savedTheme === 'dark'){
    state.theme = savedTheme; document.documentElement.setAttribute('data-theme', savedTheme);
  }
  seed();
  render();
  scheduleArrival();
})();

})();
</script>
</body>
</html>
