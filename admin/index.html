<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Rabbit Grill management: the menu and what the owner must confirm, payments, and figures that say what they count.">
<meta name="color-scheme" content="light dark">
<style>
  :root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; background: #faf9f7; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
<title>Rabbit Grill Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Noto+Sans+Thai:wght@400;500;600;700&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Rabbit Grill Khao Yai — staff platform (owner / manager)
   Tokens lifted from client/src/styles/tokens.css
   ============================================================ */
:root{
  color-scheme: light;

  /* 1. brand primitives */
  --paper:#F3ECDD; --paper-2:#E9E0CB; --bone:#F8F4EA;
  --ink:#17150F; --ink-2:#221E16; --ink-3:#2E2921;
  --forest:#1E4230; --forest-2:#2C5A40; --oxblood:#6E1621;
  --taupe:#6B5E4B; --ember:#CB6234; --ember-ink:#A8441E; --steel:#8E8B82;
  --ink-soft:#5D574A; --ink-edge:#7A7264; --ink-numeral:#857D6F;
  --paper-hover:#EFE8D8; --paper-well:#EDE5D2;
  --forest-tint:#E3EAE2; --oxblood-tint:#EEE4DC; --ember-tint:#F3E2D4;
  --sage:#D5DDD4; --blush:#EAD3D3; --ash:#B9B2A2; --ash-2:#8F8878; --smoke:#37342E;
  --sage-light:#9FC4AA; --rose-light:#E59C90; --ember-light:#E08A5E;
  --forest-night:#223127; --oxblood-night:#3A1B1C; --ember-night:#3A2419;
  --ink-0:#131109;

  /* 2. semantic roles — light paper surface */
  --canvas:var(--paper);
  --surface:var(--bone);
  --sunken:var(--paper-2);
  --well:var(--paper-well);
  --hover:var(--paper-hover);
  --text:var(--ink);
  --text-2:var(--ink-soft);
  --text-3:var(--taupe);
  --numeral:var(--ink-numeral);
  --rule:rgba(23,21,15,.14);
  --rule-soft:rgba(23,21,15,.08);
  --rule-strong:rgba(23,21,15,.26);
  --rule-ink:var(--ink);
  --edge:var(--ink-edge);
  --action:var(--forest);
  --action-hover:var(--forest-2);
  --on-action:var(--bone);
  --action-text:var(--forest);
  --selected:var(--forest-tint);
  --selected-edge:var(--forest);
  --ok:var(--forest);
  --ok-tint:var(--forest-tint);
  --alert:var(--oxblood);
  --alert-tint:var(--oxblood-tint);
  --on-alert:var(--bone);
  --heat-text:var(--ember-ink);
  --heat-tint:var(--ember-tint);
  --now:var(--ember);
  --now-text:var(--ember-ink);
  --inverse:var(--ink);
  --on-inverse:var(--bone);
  --focus:var(--ember);
  --scrim:rgba(23,21,15,.56);
  --image-bg:var(--paper-2);
  --image-mat:var(--bone);
  --tone-neutral-bg:var(--sunken); --tone-neutral-fg:var(--text);
  --tone-ok-bg:var(--ok-tint);     --tone-ok-fg:var(--ok);
  --tone-alert-bg:var(--alert-tint); --tone-alert-fg:var(--alert);
  --tone-heat-bg:var(--heat-tint); --tone-heat-fg:var(--heat-text);
  --tone-ink-bg:var(--inverse);    --tone-ink-fg:var(--on-inverse);

  /* charts */
  --chart-bar:var(--ink);
  --chart-today:var(--ember);
  --chart-future:var(--steel);
  --chart-grid:rgba(23,21,15,.10);
  --chart-axis:var(--text-2);
  --chart-missing:var(--edge);
  --chart-track:var(--paper-2);

  --shadow-card:0 1px 0 rgba(23,21,15,.04), 0 1px 3px rgba(23,21,15,.06);
  --shadow-drawer:-14px 0 40px -10px rgba(23,21,15,.30);

  /* type */
  --font-ui:"Noto Sans Thai","Leelawadee UI",Thonburi,"Helvetica Neue",Arial,sans-serif;
  --font-display:"Oswald","Noto Sans Thai","Arial Narrow",sans-serif;
  --font-serif:"Cormorant Garamond","Noto Sans Thai",Georgia,"Times New Roman",serif;
  --num-features:"tnum" 1,"lnum" 1;

  /* space / shape */
  --gutter:16px;
  --rail-w:212px;
  --radius-hair:2px; --radius-sm:4px; --radius-ctl:6px; --radius-card:8px; --radius-pill:999px;
  --tap:44px;
  --dur-fast:160ms; --dur-base:200ms;
  --ease-out:cubic-bezier(.2,.7,.3,1);
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --canvas:var(--ink-2);
    --surface:var(--ink-3);
    --sunken:#383228;
    --well:var(--ink-2);
    --hover:var(--smoke);
    --text:var(--bone);
    --text-2:var(--ash);
    --text-3:var(--ash-2);
    --numeral:var(--ash-2);
    --rule:rgba(248,244,234,.14);
    --rule-soft:rgba(248,244,234,.08);
    --rule-strong:rgba(248,244,234,.28);
    --rule-ink:var(--bone);
    --edge:var(--ash-2);
    --action:var(--forest-2);
    --action-hover:#356B4C;
    --on-action:var(--bone);
    --action-text:var(--sage-light);
    --selected:var(--forest-night);
    --selected-edge:var(--sage-light);
    --ok:var(--sage-light);
    --ok-tint:var(--forest-night);
    --alert:var(--rose-light);
    --alert-tint:var(--oxblood-night);
    --on-alert:var(--ink);
    --heat-text:var(--ember-light);
    --heat-tint:var(--ember-night);
    --now:var(--ember);
    --now-text:var(--ember-light);
    --inverse:var(--bone);
    --on-inverse:var(--ink);
    --focus:var(--ember);
    --scrim:rgba(0,0,0,.66);
    --image-bg:var(--ink-3);
    --image-mat:var(--ink-3);
    --tone-neutral-bg:#383228; --tone-neutral-fg:var(--bone);
    --tone-ok-bg:var(--forest-night); --tone-ok-fg:var(--sage-light);
    --tone-alert-bg:var(--oxblood-night); --tone-alert-fg:var(--rose-light);
    --tone-heat-bg:var(--ember-night); --tone-heat-fg:var(--ember-light);
    --tone-ink-bg:var(--bone); --tone-ink-fg:var(--ink);
    --chart-bar:var(--bone);
    --chart-today:var(--ember);
    --chart-future:var(--steel);
    --chart-grid:rgba(248,244,234,.12);
    --chart-axis:var(--ash);
    --chart-missing:var(--ash-2);
    --chart-track:#3C362B;
    --shadow-card:0 0 0 1px rgba(248,244,234,.06);
    --shadow-drawer:-14px 0 40px -10px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --canvas:var(--ink-2);
  --surface:var(--ink-3);
  --sunken:#383228;
  --well:var(--ink-2);
  --hover:var(--smoke);
  --text:var(--bone);
  --text-2:var(--ash);
  --text-3:var(--ash-2);
  --numeral:var(--ash-2);
  --rule:rgba(248,244,234,.14);
  --rule-soft:rgba(248,244,234,.08);
  --rule-strong:rgba(248,244,234,.28);
  --rule-ink:var(--bone);
  --edge:var(--ash-2);
  --action:var(--forest-2);
  --action-hover:#356B4C;
  --on-action:var(--bone);
  --action-text:var(--sage-light);
  --selected:var(--forest-night);
  --selected-edge:var(--sage-light);
  --ok:var(--sage-light);
  --ok-tint:var(--forest-night);
  --alert:var(--rose-light);
  --alert-tint:var(--oxblood-night);
  --on-alert:var(--ink);
  --heat-text:var(--ember-light);
  --heat-tint:var(--ember-night);
  --now:var(--ember);
  --now-text:var(--ember-light);
  --inverse:var(--bone);
  --on-inverse:var(--ink);
  --focus:var(--ember);
  --scrim:rgba(0,0,0,.66);
  --image-bg:var(--ink-3);
  --image-mat:var(--ink-3);
  --tone-neutral-bg:#383228; --tone-neutral-fg:var(--bone);
  --tone-ok-bg:var(--forest-night); --tone-ok-fg:var(--sage-light);
  --tone-alert-bg:var(--oxblood-night); --tone-alert-fg:var(--rose-light);
  --tone-heat-bg:var(--ember-night); --tone-heat-fg:var(--ember-light);
  --tone-ink-bg:var(--bone); --tone-ink-fg:var(--ink);
  --chart-bar:var(--bone);
  --chart-today:var(--ember);
  --chart-future:var(--steel);
  --chart-grid:rgba(248,244,234,.12);
  --chart-axis:var(--ash);
  --chart-missing:var(--ash-2);
  --chart-track:#3C362B;
  --shadow-card:0 0 0 1px rgba(248,244,234,.06);
  --shadow-drawer:-14px 0 40px -10px rgba(0,0,0,.6);
}

@media (min-width:860px){ :root{ --gutter:22px; } }
@media (min-width:1240px){ :root{ --gutter:28px; } }

*,*::before,*::after{ box-sizing:border-box; }
body{
  margin:0;
  background:var(--canvas);
  color:var(--text);
  font:400 .9375rem/1.6 var(--font-ui);
  -webkit-text-size-adjust:100%;
  overflow-x:hidden;
}
:focus-visible{
  outline:2px solid var(--focus);
  outline-offset:2px;
  border-radius:var(--radius-sm);
}
button,input,select,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; }
table{ border-collapse:collapse; }
h1,h2,h3,h4{ margin:0; font-weight:600; }
p{ margin:0; }
ul{ margin:0; padding:0; list-style:none; }
hr{ border:0; border-top:1px solid var(--rule); margin:0; }
@media (prefers-reduced-motion: reduce){
  *{ animation-duration:1ms !important; transition-duration:1ms !important; }
}

/* ---------- shell ---------- */
.app{ display:grid; grid-template-columns:1fr; min-height:100dvh; }
@media (min-width:980px){ .app{ grid-template-columns:var(--rail-w) minmax(0,1fr); } }

.rail{
  --canvas:var(--ink); --surface:var(--ink-2); --sunken:var(--ink-3);
  --text:var(--bone); --text-2:var(--ash); --text-3:var(--ash-2);
  --rule:rgba(248,244,234,.14); --rule-strong:rgba(248,244,234,.28);
  --hover:var(--smoke); --focus:var(--ember);
  background:var(--canvas); color:var(--text);
  display:flex; flex-direction:column;
  border-right:1px solid var(--rule-strong);
}
@media (max-width:979px){ .rail{ border-right:0; border-bottom:1px solid var(--rule-strong); } }

.brand{ padding:18px var(--gutter) 14px; }
.brand b{
  display:block; font:600 .9375rem/1 var(--font-serif);
  letter-spacing:.18em; text-transform:uppercase;
}
.brand span{
  display:block; margin-top:5px;
  font:500 .6875rem/1 var(--font-display);
  letter-spacing:.3em; color:var(--now); text-transform:uppercase;
}
.railnav{ padding:4px 10px 10px; display:flex; flex-direction:column; gap:1px; }
@media (max-width:979px){
  .railnav{ flex-direction:row; overflow-x:auto; gap:2px; padding:0 10px 8px; scrollbar-width:thin; }
}
.navbtn{
  display:flex; align-items:center; gap:10px;
  min-height:var(--tap); padding:8px 12px;
  background:none; border:0; border-radius:var(--radius-ctl);
  color:var(--text-2); text-align:left; white-space:nowrap;
  font:500 .875rem/1.4 var(--font-ui);
  position:relative; transition:background var(--dur-fast), color var(--dur-fast);
}
.navbtn:hover{ background:var(--hover); color:var(--text); }
.navbtn[aria-current="page"]{ background:var(--surface); color:var(--text); font-weight:600; }
.navbtn[aria-current="page"]::before{
  content:""; position:absolute; left:-10px; top:9px; bottom:9px; width:3px;
  background:var(--now); border-radius:0 2px 2px 0;
}
@media (max-width:979px){
  .navbtn[aria-current="page"]::before{ left:10px; right:10px; top:auto; bottom:-8px; width:auto; height:3px; border-radius:2px 2px 0 0; }
}
.navbtn .ico{ flex:none; width:18px; height:18px; opacity:.9; }
.navbtn .cnt{
  margin-left:auto; font:500 .75rem/1 var(--font-display);
  font-feature-settings:var(--num-features);
  background:var(--sunken); color:var(--text-2);
  padding:3px 6px; border-radius:var(--radius-pill);
}
.navbtn[aria-current="page"] .cnt{ background:var(--ink); color:var(--text); }
.railfoot{ margin-top:auto; padding:14px var(--gutter) 18px; border-top:1px solid var(--rule); }
@media (max-width:979px){ .railfoot{ display:none; } }
.seg{ display:inline-flex; border:1px solid var(--rule-strong); border-radius:var(--radius-ctl); overflow:hidden; }
.seg button{
  min-width:48px; min-height:36px; padding:6px 12px; border:0; background:none;
  color:var(--text-2); font:500 .8125rem/1 var(--font-ui);
}
.seg button[aria-pressed="true"]{ background:var(--surface); color:var(--text); font-weight:600; }
.railfoot .when{ margin-top:12px; font:400 .75rem/1.5 var(--font-ui); color:var(--text-3); }

/* ---------- topbar ---------- */
.work{ min-width:0; display:flex; flex-direction:column; background:var(--canvas); }
.topbar{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:14px var(--gutter);
  border-bottom:1px solid var(--rule);
  background:var(--canvas);
}
.topbar h1{
  font:600 1.5rem/1.1 var(--font-serif); font-style:italic; letter-spacing:.01em;
}
.demotag{
  font:500 .6875rem/1 var(--font-display); letter-spacing:.14em; text-transform:uppercase;
  color:var(--text-2); border:1px dashed var(--rule-strong);
  padding:6px 9px; border-radius:var(--radius-sm); white-space:nowrap;
}
.who{ margin-left:auto; display:flex; align-items:center; gap:10px; }
.who .mode{
  display:flex; align-items:center; gap:7px;
  font:400 .8125rem/1 var(--font-ui); color:var(--text-2);
  padding-right:12px; border-right:1px solid var(--rule);
}
.who .dot{ width:7px; height:7px; border-radius:50%; background:var(--now); flex:none; }
.who .av{
  width:34px; height:34px; border-radius:50%; flex:none;
  background:var(--inverse); color:var(--on-inverse);
  display:grid; place-items:center;
  font:500 .75rem/1 var(--font-display); letter-spacing:.04em;
}
.who .nm{ font:600 .8125rem/1.3 var(--font-ui); }
.who .nm small{ display:block; font-weight:400; color:var(--text-2); font-size:.75rem; }
@media (max-width:620px){ .who .mode, .who .nm{ display:none; } }

main{ padding:var(--gutter); padding-bottom:64px; min-width:0; }
.wrap{ max-width:1180px; margin:0 auto; }
.lede{ max-width:68ch; color:var(--text-2); font-size:.875rem; margin-bottom:18px; }
.lede b{ color:var(--text); font-weight:600; }

/* ---------- generic furniture ---------- */
.card{
  background:var(--surface); border:1px solid var(--rule);
  border-radius:var(--radius-card); box-shadow:var(--shadow-card);
}
.pad{ padding:16px; }
.sec{ margin-top:28px; }
.sechead{
  display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
  padding-bottom:8px; margin-bottom:14px; border-bottom:1px solid var(--rule-ink);
}
.sechead h2{ font:600 1.25rem/1.25 var(--font-ui); }
.sechead .en{ font:italic 500 1rem/1.2 var(--font-serif); color:var(--text-3); }
.sechead .note{ margin-left:auto; font-size:.8125rem; color:var(--text-2); }
.kicker{
  font:500 .6875rem/1.2 var(--font-display); letter-spacing:.14em;
  text-transform:uppercase; color:var(--text-2);
}
:lang(th) .kicker{ letter-spacing:0; text-transform:none; }
.num{ font-family:var(--font-display); font-feature-settings:var(--num-features); font-weight:500; }
.big{ font-size:2.5rem; line-height:1; }
.mid{ font-size:1.75rem; line-height:1; }
.muted{ color:var(--text-2); }
.tiny{ font-size:.75rem; line-height:1.5; }
.sm{ font-size:.8125rem; line-height:1.55; }

.chip{
  display:inline-flex; align-items:center; gap:5px;
  padding:3px 8px; border-radius:var(--radius-sm);
  font:500 .75rem/1.4 var(--font-ui); white-space:nowrap;
  background:var(--tone-neutral-bg); color:var(--tone-neutral-fg);
}
.chip.ok{ background:var(--tone-ok-bg); color:var(--tone-ok-fg); }
.chip.alert{ background:var(--tone-alert-bg); color:var(--tone-alert-fg); }
.chip.heat{ background:var(--tone-heat-bg); color:var(--tone-heat-fg); }
.chip.ink{ background:var(--tone-ink-bg); color:var(--tone-ink-fg); }
.chip.hollow{ background:none; border:1px solid var(--rule-strong); color:var(--text-2); }

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  min-height:var(--tap); padding:9px 16px;
  border:1px solid var(--edge); background:var(--surface); color:var(--text);
  border-radius:var(--radius-ctl); font:600 .875rem/1.2 var(--font-ui);
  transition:background var(--dur-fast), border-color var(--dur-fast);
}
.btn:hover{ background:var(--hover); }
.btn.primary{ background:var(--action); border-color:var(--action); color:var(--on-action); }
.btn.primary:hover{ background:var(--action-hover); border-color:var(--action-hover); }
.btn.sm{ min-height:34px; padding:5px 11px; font-size:.8125rem; }
.btn[disabled]{ opacity:.5; cursor:not-allowed; }
.link{
  background:none; border:0; padding:0; color:var(--action-text);
  font:600 .875rem/1.4 var(--font-ui); text-decoration:underline;
  text-underline-offset:3px;
}

.banner{
  display:flex; gap:12px; align-items:flex-start;
  padding:13px 15px; border-radius:var(--radius-card);
  background:var(--sunken); border:1px solid var(--rule);
  font-size:.875rem; color:var(--text-2); margin-bottom:18px;
}
.banner b{ color:var(--text); }
.banner.ink{ background:var(--inverse); color:var(--on-inverse); border-color:var(--inverse); }
.banner.ink b{ color:inherit; }
.banner .ico{ flex:none; width:18px; height:18px; margin-top:2px; }

.statgrid{ display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); }
.stat{ padding:14px 15px; }
.stat .v{ display:block; margin:6px 0 4px; }
.stat .h{ display:flex; align-items:center; gap:6px; }
.stat .d{ font-size:.75rem; color:var(--text-2); line-height:1.5; }

/* ---------- tables ---------- */
.tablewrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
table.data{ width:100%; min-width:640px; font-size:.875rem; }
table.data th{
  text-align:left; padding:10px 12px; white-space:nowrap;
  font:500 .6875rem/1.2 var(--font-display); letter-spacing:.12em; text-transform:uppercase;
  color:var(--text-2); border-bottom:1px solid var(--rule-ink);
}
:lang(th) table.data th{ letter-spacing:0; text-transform:none; font-family:var(--font-ui); font-size:.75rem; }
table.data td{ padding:10px 12px; border-bottom:1px solid var(--rule); vertical-align:middle; }
table.data tbody tr:hover{ background:var(--hover); }
table.data td.n, table.data th.n{ text-align:right; font-family:var(--font-display); font-feature-settings:var(--num-features); }
:lang(th) table.data td.n{ font-family:var(--font-display); }
table.data tr.off td{ opacity:.62; }

.dishcell{ display:flex; align-items:center; gap:11px; min-width:0; }
.plate{
  flex:none; width:40px; height:40px; border-radius:var(--radius-hair);
  background:
    radial-gradient(120% 100% at 30% 20%, rgba(203,98,52,.22), transparent 60%),
    linear-gradient(140deg, var(--image-bg), var(--sunken));
  box-shadow:0 0 0 3px var(--image-mat), 0 0 0 4px var(--rule);
  display:grid; place-items:center;
  font:500 .8125rem/1 var(--font-display); color:var(--text-2);
}
.plate.lg{ width:72px; height:72px; font-size:1.25rem; }
.dishcell .nm{ min-width:0; }
.dishcell .th{ font:600 .9375rem/1.45 var(--font-ui); }
.dishcell .en{ font:italic 500 .875rem/1.3 var(--font-serif); color:var(--text-3); }

/* ---------- switch ---------- */
.sw{
  display:inline-flex; align-items:center; gap:9px;
  background:none; border:0; padding:4px; min-height:var(--tap);
}
.sw .track{
  width:42px; height:24px; border-radius:var(--radius-pill); flex:none;
  background:var(--sunken); border:1px solid var(--edge); position:relative;
  transition:background var(--dur-fast), border-color var(--dur-fast);
}
.sw .knob{
  position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%;
  background:var(--text-2); transition:transform var(--dur-base) var(--ease-out), background var(--dur-fast);
}
.sw[aria-pressed="true"] .track{ background:var(--alert-tint); border-color:var(--alert); }
.sw[aria-pressed="true"] .knob{ transform:translateX(18px); background:var(--alert); }
.sw .lbl{ font:500 .8125rem/1.3 var(--font-ui); color:var(--text-2); white-space:nowrap; }
.sw[aria-pressed="true"] .lbl{ color:var(--alert); font-weight:600; }

/* ---------- filters ---------- */
.filters{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:16px; }
.pillset{ display:inline-flex; border:1px solid var(--rule-strong); border-radius:var(--radius-ctl); overflow:hidden; }
.pillset button{
  min-height:40px; padding:7px 13px; border:0; background:none; color:var(--text-2);
  font:500 .8125rem/1.2 var(--font-ui); display:inline-flex; align-items:center; gap:6px;
}
.pillset button + button{ border-left:1px solid var(--rule-strong); }
.pillset button[aria-pressed="true"]{ background:var(--inverse); color:var(--on-inverse); font-weight:600; }
.pillset button .c{ font-family:var(--font-display); font-feature-settings:var(--num-features); opacity:.75; }
.field{
  display:inline-flex; align-items:center; gap:8px;
  border:1px solid var(--edge); border-radius:var(--radius-ctl);
  background:var(--surface); padding:0 12px; min-height:40px;
}
.field svg{ flex:none; opacity:.6; }
.field input, .field select{
  border:0; background:none; outline:none; min-height:38px; font-size:1rem; min-width:0;
}
.field input{ width:min(260px,46vw); }
.field select{ padding-right:4px; }
.chkline{ display:inline-flex; align-items:center; gap:8px; min-height:40px; font-size:.875rem; }
.chkline input{ width:18px; height:18px; accent-color:var(--action); }

.empty{ padding:40px 20px; text-align:center; color:var(--text-2); font-size:.875rem; }

/* ---------- bars ---------- */
.barrow{ display:grid; grid-template-columns:minmax(96px,1fr) auto; gap:4px 12px; align-items:baseline; margin-bottom:9px; }
.barrow .lb{ font-size:.875rem; }
.barrow .vv{ font-family:var(--font-display); font-feature-settings:var(--num-features); font-weight:500; white-space:nowrap; }
.barrow .vv i{ font-style:normal; color:var(--text-2); font-size:.8125rem; margin-left:5px; }
.barrow .tr{ grid-column:1/-1; height:7px; border-radius:2px; background:var(--chart-track); overflow:hidden; }
.barrow .fl{ height:100%; background:var(--chart-bar); border-radius:2px; }
.barrow .fl.ok{ background:var(--ok); }
.barrow .fl.zero{ background:none; }

/* ---------- drawer ---------- */
.scrim{
  position:fixed; inset:0; background:var(--scrim); z-index:40;
  animation:fade var(--dur-base) var(--ease-out);
}
@keyframes fade{ from{opacity:0} to{opacity:1} }
.drawer{
  position:fixed; top:0; right:0; bottom:0; z-index:41;
  width:min(560px,100vw); background:var(--canvas);
  border-left:1px solid var(--rule-strong); box-shadow:var(--shadow-drawer);
  display:flex; flex-direction:column;
  animation:slide var(--dur-base) var(--ease-out);
}
@keyframes slide{ from{transform:translateX(18px); opacity:.6} to{transform:none; opacity:1} }
.drawer header{
  display:flex; gap:12px; align-items:flex-start;
  padding:16px var(--gutter); border-bottom:1px solid var(--rule);
}
.drawer .body{ overflow-y:auto; padding:16px var(--gutter) 28px; flex:1; }
.drawer footer{
  display:flex; gap:10px; align-items:center; flex-wrap:wrap;
  padding:12px var(--gutter); border-top:1px solid var(--rule); background:var(--surface);
}
.closeb{
  margin-left:auto; flex:none; width:38px; height:38px; border-radius:var(--radius-ctl);
  border:1px solid var(--rule-strong); background:none; color:var(--text-2);
  display:grid; place-items:center; font-size:1.1rem; line-height:1;
}
.closeb:hover{ background:var(--hover); color:var(--text); }

.fgrid{ display:grid; gap:14px; grid-template-columns:1fr; }
@media (min-width:480px){ .fgrid.two{ grid-template-columns:1fr 1fr; } }
label.f{ display:block; }
label.f .lab{ display:block; font:600 .8125rem/1.4 var(--font-ui); margin-bottom:5px; }
label.f .lab i{ font-style:normal; font-weight:400; color:var(--text-2); }
label.f input, label.f textarea{
  width:100%; padding:10px 12px; font-size:1rem;
  background:var(--surface); color:var(--text);
  border:1px solid var(--edge); border-radius:var(--radius-ctl);
}
label.f .hint{ display:block; margin-top:5px; font-size:.75rem; color:var(--text-2); line-height:1.5; }
.checklist li{ display:flex; gap:9px; padding:5px 0; font-size:.8125rem; align-items:flex-start; }
.checklist .mk{ flex:none; width:16px; font-family:var(--font-display); }
.checklist .yes .mk{ color:var(--ok); }
.checklist .no .mk{ color:var(--text-2); }

.block{ border:1px solid var(--rule); border-radius:var(--radius-card); padding:14px; background:var(--surface); }
.block + .block{ margin-top:14px; }
.block h3{ font:600 .9375rem/1.3 var(--font-ui); margin-bottom:9px; }
.kv{ display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:.8125rem; }
.kv dt{ color:var(--text-2); white-space:nowrap; }
.kv dd{ margin:0; }

/* ---------- charts ---------- */
.chartbox{ padding:16px; }
.chartbox svg{ display:block; width:100%; height:auto; }
.legend{ display:flex; flex-wrap:wrap; gap:8px 18px; margin-top:12px; font-size:.75rem; color:var(--text-2); }
.legend span{ display:inline-flex; align-items:center; gap:7px; }
.legend i{ width:14px; height:11px; flex:none; border-radius:1px; display:inline-block; }
.srt{ position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }

.cols{ display:grid; gap:14px; grid-template-columns:1fr; }
@media (min-width:900px){ .cols.a{ grid-template-columns:300px minmax(0,1fr); } .cols.b{ grid-template-columns:1fr 1fr; } }

.limits li{ position:relative; padding-left:16px; font-size:.8125rem; line-height:1.6; color:var(--text-2); }
.limits li::before{ content:""; position:absolute; left:3px; top:.7em; width:4px; height:4px; border-radius:50%; background:var(--text-3); }
.toast{
  position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
  z-index:60; background:var(--inverse); color:var(--on-inverse);
  padding:11px 17px; border-radius:var(--radius-ctl); font:500 .875rem/1.3 var(--font-ui);
  box-shadow:0 8px 24px -6px rgba(23,21,15,.45); max-width:calc(100vw - 32px);
}
</style>

/* ===========================================================
   3. State + helpers
   =========================================================== */
var LS = 'rg-admin-demo-v1';
var state = {
  lang:'en', nav:'menu',
  mcat:'all', mgroup:'all', q:'', soldOnly:false, open:null,
  soldOut:{}, verified:{}, edits:{},
  rgroup:'none', rcat:'all', rlimit:10, rsort:'most',
  billOpen:null, dishAll:false
};
try{
  var raw = localStorage.getItem(LS);
  if(raw){ var o = JSON.parse(raw); ['lang','nav','soldOut','verified','edits'].forEach(function(k){ if(o[k]!==undefined) state[k]=o[k]; }); }
}catch(e){ /* private mode, blocked storage: carry on with defaults */ }
function save(){
  try{ localStorage.setItem(LS, JSON.stringify({ lang:state.lang, nav:state.nav, soldOut:state.soldOut, verified:state.verified, edits:state.edits })); }
  catch(e){ /* nothing to do; the page works without it */ }
}

function t(k, vars){
  var e = S[k]; var s = e ? (e[state.lang] || e.en) : k;
  if(vars) Object.keys(vars).forEach(function(v){ s = s.split('{'+v+'}').join(vars[v]); });
  return s;
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function money(sat){
  var neg = sat<0; sat = Math.abs(Math.round(sat));
  var b = Math.floor(sat/100), c = sat%100;
  var s = b.toLocaleString('en-US');
  if(c) s += '.' + String(c).padStart(2,'0');
  return (neg?'−':'') + '฿' + s;
}
function pct(n, d){ return d ? Math.round(n/d*100) : 0; }
function dur(sec){
  if(sec < 60) return '<span class="num">'+sec+'</span> '+t('secs');
  var m = Math.floor(sec/60), s = sec%60;
  return '<span class="num">'+m+'</span> '+t('mins')+(s?' <span class="num">'+s+'</span> '+t('secs'):'');
}

/* name resolution — `th` may be null for drinks: show `en` in both */
function nmTh(it){ var e = state.edits[it.id]; if(e && e.th!=null) return e.th || (e.en!=null?e.en:it.en); return it.th || it.en; }
function nmEn(it){ var e = state.edits[it.id]; if(e && e.en!=null && e.en!=='') return e.en; return it.en; }
function nmPrimary(it){ return state.lang==='th' ? nmTh(it) : nmEn(it); }
function nmSecondary(it){ return state.lang==='th' ? nmEn(it) : nmTh(it); }
function catName(c){ return state.lang==='th' ? (c.th || c.en) : c.en; }
function itPrice(it){ var e = state.edits[it.id]; return (e && 'price' in e) ? e.price : it.price; }
function itRate(it){ var e = state.edits[it.id]; return (e && 'rate' in e) ? e.rate : it.rate; }
function hasPrice(it){ return itPrice(it)!=null || itRate(it)!=null; }
function isSoldOut(it){ return !!state.soldOut[it.id]; }
function isVerified(it){ return !!state.verified[it.id]; }
/* orderable in the real product: a price, in stock, and not held back for verification */
function blockReason(it){
  if(!hasPrice(it)) return 'no_price';
  if(it.why==='unverified' && !isVerified(it)) return 'unverified';
  return null;
}
function canOrder(it){ return !blockReason(it) && !isSoldOut(it); }
function edited(it){
  var e = state.edits[it.id]; if(!e) return false;
  return Object.keys(e).some(function(k){ return e[k] !== it[k]; });
}
function priceLabel(it){
  var r = itRate(it);
  if(r!=null) return money(r) + ' <i>/ ' + it.basis + ' ' + t('g') + '</i>';
  var p = itPrice(it);
  return p==null ? '<span class="muted">—</span>' : money(p);
}
function plate(it, cls){
  var ch = esc((nmEn(it)||'?').trim().charAt(0).toUpperCase());
  return '<span class="plate'+(cls?' '+cls:'')+'" aria-hidden="true">'+ch+'</span>';
}
function counts(){
  var c = { all:0, food:0, drinks:0, soldOut:0, order:0, noPrice:0, unver:0, verified:0, noThai:0, photo:0 };
  ITEMS.forEach(function(it){
    c.all++;
    if(it.station==='kitchen') c.food++; else c.drinks++;
    if(isSoldOut(it)) c.soldOut++;
    if(canOrder(it)) c.order++;
    var b = blockReason(it);
    if(b==='no_price') c.noPrice++;
    if(b==='unverified') c.unver++;
    if(isVerified(it)) c.verified++;
    if(!it.th) c.noThai++;
  });
  c.blocked = c.noPrice + c.unver;
  return c;
}

function filteredItems(){
  var q = state.q.trim().toLowerCase();
  return ITEMS.filter(function(it){
    if(state.mgroup==='food' && it.station!=='kitchen') return false;
    if(state.mgroup==='drinks' && it.station!=='bar') return false;
    if(state.mcat!=='all' && it.cat!==state.mcat) return false;
    if(state.soldOnly && !isSoldOut(it)) return false;
    if(q){
      var hay = [nmEn(it), nmTh(it), it.key, CATBY[it.cat].en].join(' ').toLowerCase();
      if(hay.indexOf(q) === -1) return false;
    }
    return true;
  });
}
function statusCell(it){
  var h = '';
  if(isSoldOut(it)) h += '<span class="chip alert">'+esc(t('soldout'))+'</span> ';
  var b = blockReason(it);
  if(b==='no_price') h += '<span class="chip hollow">'+esc(t('noprice_short'))+'</span>';
  else if(b==='unverified') h += '<span class="chip hollow">'+esc(t('unver_short'))+'</span>';
  else if(!isSoldOut(it)) h += '<span class="chip ok">'+esc(t('canorder'))+'</span>';
  if(isVerified(it)) h += ' <span class="chip ink">'+esc(t('verified'))+'</span>';
  if(edited(it)) h += ' <span class="chip heat">'+esc(t('changed_here'))+'</span>';
  return h;

function viewReview(){

  var noPrice = ITEMS.filter(function(it){ return blockReason(it)==='no_price'; });

  var whole = CATS.filter(function(cat){

  });

  var h = '<p class="lede">'+esc(t('rev_lede'))+'</p>';

    + statCard(t('noprice_group'), c.noPrice, t('noprice_d'))
    + statCard(t('unver_group'), c.unver, t('unver_d'))
    + statCard(t('thainames_missing'), c.noThai, t('thainames_d'))
    + statCard(t('photos_missing'), 0, t('photos_d'))
    + '</div>';

  var catsLine = whole.length
    ? '<div class="banner"><span class="ico">'+ico('info')+'</span><span>'
      + whole.map(function(x){ return '<b>'+esc(catName(x))+'</b>'; }).join(' · ')
      + ' — <span class="num">'+whole.reduce(function(n,x){ return n+ITEMS.filter(function(i){return i.cat===x.id;}).length; },0)+'</span> '
      + esc(t('dishes'))+'. '+esc(t('noprice_why'))+'</span></div>'
    : '';

  h += reviewGroup(t('noprice_group'), t('noprice_why'), noPrice, catsLine);
  h += reviewGroup(t('unver_group'), t('unver_why'), unver, '');
  h += '<p class="lede" style="margin-top:22px">'+esc(t('demo_signoff'))+'</p>';
  return h;
}

   9. Payments — every amount is summed from catalog prices
   =========================================================== */
function billTotal(b){
  var sum = 0;
  (b.lines||[]).forEach(function(l){
    var it = ITEMKEY[l[0]];
    if(it && it.price!=null) sum += it.price * l[1];
  });
  (b.weighed||[]).forEach(function(w){
    var it = ITEMKEY[w[0]];
    if(it && it.rate!=null) sum += Math.round(it.rate * w[1] / it.basis);
  });
  return b.kind==='reversal' ? -sum : sum;
}
function billLinesHtml(b){
  var h = '<table class="data" style="min-width:0;font-size:.8125rem"><tbody>';
  (b.lines||[]).forEach(function(l){
    var it = ITEMKEY[l[0]]; if(!it) return;
    h += '<tr><td>'+esc(nmPrimary(it))+'</td><td class="n"><span class="num">'+l[1]+'</span> × '+money(it.price)+'</td>'
       + '<td class="n">'+money(it.price*l[1])+'</td></tr>';
  });
  (b.weighed||[]).forEach(function(w){
    var it = ITEMKEY[w[0]]; if(!it) return;
    h += '<tr><td>'+esc(nmPrimary(it))+'</td><td class="n"><span class="num">'+w[1]+'</span> '+esc(t('g'))+' × '+money(it.rate)+' / '+it.basis+' '+esc(t('g'))+'</td>'
       + '<td class="n">'+money(Math.round(it.rate*w[1]/it.basis))+'</td></tr>';
  });
  return h + '</tbody></table>';
}

/* ===========================================================
   10. Order stats — SVG bar chart, drawn to scale
   =========================================================== */
function axisMax(v){
  var steps = [5,10,15,20,25,30,40,50,75,100];
  for(var i=0;i<steps.length;i++) if(v <= steps[i]) return steps[i];
  return Math.ceil(v/50)*50;
}
function roundsChart(){
  var days = DEMO.days;
  var maxV = Math.max.apply(null, days.map(function(d){ return d.rounds||0; }));
  var top = axisMax(maxV);
  var W = 720, H = 300, L = 42, R = 10, T = 18, B = 52;
  var pw = W-L-R, ph = H-T-B;
  var n = days.length, slot = pw/n, bw = Math.min(58, slot*0.56);
  var ticks = [0, top/3, top*2/3, top].map(function(v){ return Math.round(v); });

  var s = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(t('roundsperday'))+'">';
  s += '<defs><pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">'
     + '<line x1="0" y1="0" x2="0" y2="7" stroke="var(--chart-missing)" stroke-width="1.6"/></pattern></defs>';
  /* grid + y labels */
  ticks.forEach(function(v){
    var y = T + ph - (v/top)*ph;
    s += '<line x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(W-R)+'" y2="'+y.toFixed(1)+'" stroke="var(--chart-grid)" stroke-width="1"/>';
    s += '<text x="'+(L-9)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" font-family="var(--font-display)" font-size="12" fill="var(--chart-axis)">'+v+'</text>';
  });
  s += '<line x1="'+L+'" y1="'+(T+ph)+'" x2="'+(W-R)+'" y2="'+(T+ph)+'" stroke="var(--chart-axis)" stroke-width="1.2"/>';

  days.forEach(function(d, i){
    var cx = L + slot*i + slot/2, x = cx - bw/2;
    if(d.state==='upcoming'){
      s += '<rect x="'+x.toFixed(1)+'" y="'+T+'" width="'+bw.toFixed(1)+'" height="'+ph+'" fill="url(#hatch)" opacity=".5"/>'
         + '<rect x="'+x.toFixed(1)+'" y="'+T+'" width="'+bw.toFixed(1)+'" height="'+ph+'" fill="none" stroke="var(--chart-missing)" stroke-width="1" stroke-dasharray="3 3"/>';
    } else {
      var bh = (d.rounds/top)*ph, y = T + ph - bh;
      var partial = d.state==='partial';
      s += '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" '
         + (partial ? 'fill="var(--canvas)" stroke="var(--chart-today)" stroke-width="2.5"' : 'fill="var(--chart-bar)"')+'/>';
      s += '<text x="'+cx.toFixed(1)+'" y="'+(y-7).toFixed(1)+'" text-anchor="middle" font-family="var(--font-display)" font-size="14" font-weight="500" fill="var(--text)">'+d.rounds+'</text>';
    }
    s += '<text x="'+cx.toFixed(1)+'" y="'+(T+ph+20)+'" text-anchor="middle" font-size="13" fill="'+(d.state==='partial'?'var(--now-text)':'var(--text)')+'" font-weight="'+(d.state==='partial'?600:400)+'">'+esc(d.dn[state.lang])+' '+d.dd+'</text>';
    s += '<text x="'+cx.toFixed(1)+'" y="'+(T+ph+38)+'" text-anchor="middle" font-size="11" fill="var(--text-2)">'
       + esc(d.state==='partial'?t('lg_partial'):(d.state==='upcoming'?t('lg_upcoming').split('—')[0].trim():t('lg_complete')))+'</text>';
  });
  s += '</svg>';
  return s;
}
function hourChart(){
  var hs = DEMO.hoursToday, top = axisMax(Math.max.apply(null, hs.map(function(x){return x.n;})));
  var W=260,H=120,L=22,B=26,T=14,R=6, pw=W-L-R, ph=H-T-B, slot=pw/hs.length, bw=Math.min(26,slot*0.5);
  var s = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(t('roundsbyhour'))+'">';
  s += '<line x1="'+L+'" y1="'+(T+ph)+'" x2="'+(W-R)+'" y2="'+(T+ph)+'" stroke="var(--chart-axis)" stroke-width="1"/>';
  s += '<text x="'+(L-6)+'" y="'+(T+5)+'" text-anchor="end" font-family="var(--font-display)" font-size="10" fill="var(--chart-axis)">'+top+'</text>';
  hs.forEach(function(x,i){
    var cx = L+slot*i+slot/2, bh = (x.n/top)*ph, y = T+ph-bh;
    s += '<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw+'" height="'+bh.toFixed(1)+'" fill="var(--chart-bar)"/>';
    s += '<text x="'+cx.toFixed(1)+'" y="'+(y-4).toFixed(1)+'" text-anchor="middle" font-family="var(--font-display)" font-size="11" fill="var(--text)">'+x.n+'</text>';

  });
  return s + '</svg>';
}

  h += '<div class="statgrid" style="margin-top:14px">'

/* ===========================================================
   11. Menu stats
   =========================================================== */
function servingsOf(it){ return DEMO.servings[it.key] || 0; }
function availOf(it){
  var a = DEMO.availDays[it.key];
  return a==null ? DEMO.elapsedDays : a;
}
function rankable(it){
  /* an item nobody could ever add this week is not a ranking result */
  return it.orderable && availOf(it) > 0;
}
function viewDishes(){
  var group = state.rgroup==='drinks' ? 'bar' : 'kitchen';
  var pool = ITEMS.filter(function(it){ return it.station===group; });
  var ranked = pool.filter(rankable);
  var soldOutAll = pool.filter(function(it){ return it.orderable && availOf(it)===0; });
  var neverOrderable = pool.filter(function(it){ return !it.orderable; });

  var totalServ = ranked.reduce(function(n,it){ return n + servingsOf(it); }, 0);
  var maxServ = Math.max(1, Math.max.apply(null, ranked.map(servingsOf)));

  var sorted = ranked.slice().sort(function(a,b){
    var d = servingsOf(b) - servingsOf(a);
    if(state.rsort==='least') d = -d;
    return d || nmEn(a).localeCompare(nmEn(b));
  });
  var shown = state.dishAll ? sorted : sorted.slice(0, 10);

  /* dense ranks, ties share a rank */
  var ranks = {}, last = null, lastRank = 0;
  sorted.forEach(function(it, i){
    var v = servingsOf(it);
    if(v !== last){ lastRank = i+1; last = v; }
    ranks[it.id] = lastRank;
  });

  var h = '<p class="lede">'+esc(t('dish_lede'))+'</p>';
  h += '<div class="banner"><span class="ico">'+ico('info')+'</span><span><b>'+esc(t('thisweek'))+' · '
     + esc(DEMO.weekLabel[state.lang])+'.</b> '+esc(t('dataasof'))+' <span class="num">'+DEMO.clock+'</span> · '+esc(t('demodata'))+'.</span></div>';

  h += '<div class="filters">'
    + '<div class="pillset" role="group">'
    + '<button data-rg="food" aria-pressed="'+(state.rgroup!=='drinks')+'">'+esc(t('foodonly'))+'</button>'
    + '<button data-rg="drinks" aria-pressed="'+(state.rgroup==='drinks')+'">'+esc(t('drinksonly'))+'</button>'
    + '</div>'
    + '<div class="pillset" role="group">'
    + '<button data-rs="most" aria-pressed="'+(state.rsort!=='least')+'">'+esc(t('most'))+'</button>'
    + '<button data-rs="least" aria-pressed="'+(state.rsort==='least')+'">'+esc(t('least'))+'</button>'
    + '</div>'
    + '<button class="btn sm" data-dishall="1">'+esc(state.dishAll?t('showless'):t('showall'))+' <span class="num">'+sorted.length+'</span></button>'
    + '</div>';

  h += '<div class="card"><div class="tablewrap"><table class="data"><thead><tr>'
    + '<th class="n">'+esc(t('rank'))+'</th><th>'+esc(t('dish'))+'</th>'
    + '<th class="n">'+esc(t('servings'))+' · '+esc(t('share'))+'</th>'
    + '<th>'+esc(t('availdays'))+'</th><th>'+esc(t('vslast'))+'</th>'
    + '</tr></thead><tbody>';
  shown.forEach(function(it){
    var v = servingsOf(it), a = availOf(it);
    var w = Math.round(v/maxServ*100);
    h += '<tr>'
      + '<td class="n" style="font-size:1.125rem">'+String(ranks[it.id]).padStart(2,'0')+'</td>'
      + '<td><button class="dishcell" data-edit="'+it.id+'" style="background:none;border:0;padding:0;text-align:left;width:100%">'
        + plate(it)+'<span class="nm"><span class="th">'+esc(nmPrimary(it))+'</span>'
        + (nmSecondary(it)!==nmPrimary(it)?'<span class="en" lang="'+(state.lang==='th'?'en':'th')+'">'+esc(nmSecondary(it))+'</span>':'')
        + '</span></button></td>'
      + '<td style="min-width:170px"><div class="barrow" style="margin:0">'
        + '<span class="vv"><span style="font-size:1.0625rem">'+v+'</span><i>'+pct(v,totalServ)+'%</i></span>'
        + '<span></span><span class="tr"><span class="fl" style="width:'+w+'%"></span></span></div></td>'
      + '<td class="sm'+(a<DEMO.elapsedDays?' ':'')+'">'+(a<DEMO.elapsedDays
          ? '<span class="chip heat">'+esc(t('availfrag',{a:a,b:DEMO.elapsedDays}))+'</span>'
          : '<span class="muted">'+esc(t('availfrag',{a:a,b:DEMO.elapsedDays}))+'</span>')+'</td>'
      + '<td class="sm muted">'+esc(t('nobaseline'))+'</td>'
      + '</tr>';
  });
  h += '</tbody></table></div>'
    + '<div class="pad tiny muted" style="border-top:1px solid var(--rule)">'
    + esc(t('showing'))+' <span class="num">'+shown.length+'</span> '+esc(t('of'))+' <span class="num">'+sorted.length+'</span> · '
    + esc(t('ties'))+' '+esc(t('wow_why',{d:DEMO.recordsBegin[state.lang]}))
    + '</div></div>';

  if(soldOutAll.length){
    h += '<section class="sec"><div class="sechead"><h2>'+esc(t('soldout_block_h'))+'</h2>'
      + '<span class="note"><span class="num">'+soldOutAll.length+'</span> '+esc(t('dishes'))+'</span></div>'
      + '<p class="lede">'+esc(t('soldout_block_d'))+'</p><div class="card"><div class="tablewrap"><table class="data"><tbody>'
      + soldOutAll.map(function(it){
          return '<tr><td><button class="dishcell" data-edit="'+it.id+'" style="background:none;border:0;padding:0;text-align:left;width:100%">'
            + plate(it)+'<span class="nm"><span class="th">'+esc(nmPrimary(it))+'</span>'
            + (nmSecondary(it)!==nmPrimary(it)?'<span class="en" lang="'+(state.lang==='th'?'en':'th')+'">'+esc(nmSecondary(it))+'</span>':'')
            + '</span></button></td>'
            + '<td class="sm muted">'+esc(catName(CATBY[it.cat]))+'</td>'
            + '<td><span class="chip alert">'+esc(t('soldout_allweek'))+'</span></td>'
            + '<td class="n sm muted">'+esc(t('availfrag',{a:0,b:DEMO.elapsedDays}))+'</td></tr>';
        }).join('')
      + '</tbody></table></div></div></section>';
  }
  if(neverOrderable.length){
    h += '<section class="sec"><div class="sechead"><h2>'+esc(t('blocked_block_h'))+'</h2>'
      + '<span class="note"><span class="num">'+neverOrderable.length+'</span> '+esc(t('dishes'))+'</span></div>'
      + '<p class="lede">'+esc(t('blocked_block_d',{n:neverOrderable.length}))+'</p>'
      + '<div class="card pad"><div style="display:flex;flex-wrap:wrap;gap:7px">'
      + neverOrderable.map(function(it){
          return '<button class="chip hollow" data-edit="'+it.id+'" style="cursor:pointer">'+esc(nmPrimary(it))+'</button>';
        }).join('')
      + '</div></div></section>';
  }
  return h;
}

/* ===========================================================
   12. Engagement
   =========================================================== */
function bar(label, value, denom, suffix, cls){
  return '<div class="barrow">'
    + '<span class="lb">'+label+'</span>'
    + '<span class="vv">'+value+(suffix!=null?'<i>'+suffix+'</i>':'')+'</span>'
    + '<span class="tr"><span class="fl'+(cls?' '+cls:'')+'" style="width:'+(denom?Math.max(0,Math.min(100,value/denom*100)):0)+'%"></span></span>'
    + '</div>';
}
function engDishRows(){
  var pool = ITEMS.filter(function(it){ return it.station==='kitchen' && it.orderable; });
  var rows = pool.map(function(it){
    var sv = servingsOf(it);
    var seen = Math.min(DEMO.eng.sessions, 6 + sv*2);
    var adds = sv + Math.floor(sv/5);
    var det  = Math.max(adds, Math.round(seen*0.45));
    return { it:it, seen:seen, det:det, adds:adds, sent:sv, rate: seen?Math.round(adds/seen*100):0 };
  }).sort(function(a,b){ return b.seen-a.seen || nmEn(a.it).localeCompare(nmEn(b.it)); });
  return state.dishAll ? rows : rows.slice(0,10);
}
function viewEngagement(){
  var E = DEMO.eng;
  var h = '<p class="lede">'+esc(t('eng_lede'))+'</p>';
  h += '<div class="banner"><span class="ico">'+ico('info')+'</span><span><b>'+esc(t('period'))+' · '
     + esc(DEMO.weekLabel[state.lang])+'.</b> '+esc(t('demodata'))+' · '+esc(t('session_is'))+'</span></div>';

  h += '<div class="cols b">';
  /* coverage */
  h += '<div class="card pad"><div class="kicker">'+esc(t('coverage'))+'</div>'
    + '<p class="num big" style="margin:10px 0 2px">'+E.sessions+'</p>'
    + '<p class="sm muted">'+esc(t('meas_sessions'))+'</p>'
    + '<div style="margin-top:14px">'
      + bar(esc(t('attable')), E.atTable, E.sessions, pct(E.atTable,E.sessions)+'%')
      + bar(esc(t('browsing')), E.browsingOnly, E.sessions, pct(E.browsingOnly,E.sessions)+'%')
    + '</div>'
    + '<dl class="kv" style="margin-top:12px">'
      + '<dt>'+esc(t('optedout'))+'</dt><dd class="num">'+E.optedOut+'</dd>'
      + '<dt>'+esc(t('measuredsince'))+'</dt><dd>'+esc(E.measuredSince[state.lang])+'</dd>'
      + '<dt>'+esc(t('period'))+'</dt><dd>'+esc(DEMO.weekLabel[state.lang])+'</dd>'
    + '</dl></div>';
  /* limits */
  h += '<div class="card pad" style="background:var(--sunken)"><div class="kicker">'+esc(t('limits'))+'</div>'
    + '<ul class="limits" style="margin-top:10px">'
    + ['lim1','lim2','lim3','lim4','lim5','lim6'].map(function(k){ return '<li>'+esc(t(k))+'</li>'; }).join('')
    + '</ul></div>';
  h += '</div>';

  h += '<div class="cols b" style="margin-top:14px">';
  h += '<div>'
    + '<div class="card pad"><div class="kicker">'+esc(t('activemenu'))+'</div>'
      + '<p class="big num" style="margin:8px 0 4px">'+dur(E.medianMenuSec)+'</p>'
      + '<p class="sm muted">'+esc(t('activemenu_d'))+' · p90 '+dur(E.p90MenuSec)+' · <span class="num">'+E.menuSessions+'</span> '+esc(t('sessions_w'))+'</p></div>'
    + '<div class="card pad" style="margin-top:14px"><div class="kicker">'+esc(t('activedetail'))+'</div>'
      + '<p class="big num" style="margin:8px 0 4px">'+dur(E.medianDetailSec)+'</p>'
      + '<p class="sm muted">'+esc(t('activedetail_d'))+' · p90 '+dur(E.p90DetailSec)+' · <span class="num">'+E.detailViews+'</span> '+esc(t('details'))+'</p></div>'
    + '<div class="card pad" style="margin-top:14px"><div class="kicker">'+esc(t('roundsmeas'))+'</div>'
      + '<p class="mid num" style="margin:8px 0 10px">'+E.roundsPeriod+'</p>'
      + bar(esc(t('frommeasured')), E.roundsMeasured, E.roundsPeriod, pct(E.roundsMeasured,E.roundsPeriod)+'%')
      + bar(esc(t('notlinked')), E.roundsUnlinked, E.roundsPeriod, pct(E.roundsUnlinked,E.roundsPeriod)+'%')
      + '<p class="tiny muted" style="margin-top:8px">'+esc(t('notlinked_d'))+'</p></div>'
    + '</div>';
  /* funnel */
  var base = E.funnel[0].v;
  h += '<div class="card pad"><div class="kicker">'+esc(t('funnel'))+'</div>'
    + '<div style="margin-top:12px">'
    + E.funnel.map(function(f){
        var lab = { base:'f_base', saw:'f_saw', details:'f_details', added:'f_added', sent:'f_sent' }[f.k];
        return bar(esc(t(lab)), f.v, base, f.k==='base' ? esc(t('f_base')) : pct(f.v,base)+'%', f.k==='sent'?'ok':'');
      }).join('')
    + '</div>'
    + '<p class="sm muted" style="margin-top:10px">'+esc(t('funnel_base'))+'</p>'
    + '<div class="banner" style="margin:12px 0 0"><span>'+esc(t('straight',{n:E.straightFromList}))+'</span></div>'
    + '</div>';
  h += '</div>';

  /* exposure + depth */
  h += '<div class="cols b" style="margin-top:14px">';
  h += '<div class="card pad"><div class="kicker">'+esc(t('catexposure'))+'</div><div style="margin-top:12px">'
    + CATS.map(function(c){
        var v = E.exposure[c.key] || 0;
        return bar(esc(catName(c)), v, E.sessions, pct(v,E.sessions)+'%', v?'':'zero');
      }).join('')
    + '</div><p class="tiny muted" style="margin-top:6px">'+esc(t('catexposure_d'))+'</p></div>';
  h += '<div><div class="card pad"><div class="kicker">'+esc(t('depth'))+'</div><div style="margin-top:12px">'
    + E.depth.map(function(d){ return bar(esc(t('reached'))+' '+d.p+'%', d.v, E.sessions, pct(d.v,E.sessions)+'%'); }).join('')
    + '</div><p class="tiny muted" style="margin-top:6px">'+esc(t('depth_d'))+'</p></div>'
    + '<div class="card pad" style="margin-top:14px"><div class="kicker">'+esc(t('daybyday'))+'</div>'
      + '<div style="margin-top:12px">'
      + E.byDay.map(function(d){
          var day = DEMO.days.filter(function(x){ return x.k===d.k; })[0];
          return bar(esc(day.dn[state.lang]+' '+day.dd), d.s, Math.max.apply(null,E.byDay.map(function(x){return x.s;})), esc(t('sessions_w')));
        }).join('')
      + '</div></div></div>';
  h += '</div>';

  /* dish table */
  var rows = engDishRows();
  h += '<section class="sec"><div class="sechead"><h2>'+esc(t('dishesonphones'))+'</h2>'
    + '<span class="note">'+esc(t('dishcount_d'))+'</span></div>'
    + '<div class="card"><div class="tablewrap"><table class="data"><thead><tr>'
    + '<th>'+esc(t('dish'))+'</th><th class="n">'+esc(t('seen'))+'</th><th class="n">'+esc(t('details'))+'</th>'
    + '<th class="n">'+esc(t('adds'))+'</th><th class="n">'+esc(t('addrate'))+'</th><th class="n">'+esc(t('sent'))+'</th>'
    + '</tr></thead><tbody>'
    + rows.map(function(r){
        return '<tr><td><div class="dishcell"><span class="nm"><span class="th">'+esc(nmPrimary(r.it))+'</span>'
          + (nmSecondary(r.it)!==nmPrimary(r.it)?'<span class="en" lang="'+(state.lang==='th'?'en':'th')+'">'+esc(nmSecondary(r.it))+'</span>':'')
          + '</span></div></td>'
          + '<td class="n">'+r.seen+'</td><td class="n">'+r.det+'</td><td class="n">'+r.adds+'</td>'
          + '<td class="n">'+r.rate+'%</td><td class="n">'+r.sent+'</td></tr>';
      }).join('')
    + '</tbody></table></div>'
    + '<div class="pad"><button class="btn sm" data-dishall="1">'+esc(state.dishAll?t('showless'):t('showall'))+'</button></div>'
    + '</div></section>';
  return h;
}


/* ===========================================================
   13. Render loop
   =========================================================== */
var $rail = document.getElementById('rail'),
    $top  = document.getElementById('topbar'),
    $view = document.getElementById('view'),
    $ov   = document.getElementById('overlay'),
    $toast= document.getElementById('toast');

function render(){
  var a = document.activeElement;
  var fk = a && a.getAttribute ? a.getAttribute('data-fk') : null;
  var fid = a && a.getAttribute ? a.getAttribute('data-id') : null;
  var selS = null, selE = null;
  try{ selS = a.selectionStart; selE = a.selectionEnd; }catch(e){}

  document.documentElement.lang = state.lang;
  $rail.innerHTML = renderRail();
  $top.innerHTML  = renderTop();
  $view.innerHTML = ({
    menu:viewMenu, review:viewReview, payments:viewPayments,
    orders:viewOrders, dishes:viewDishes, engagement:viewEngagement
  })[state.nav]();
  $ov.innerHTML = state.open && ITEMBY[state.open] ? viewEditor(ITEMBY[state.open]) : '';
  document.body.style.overflow = state.open ? 'hidden' : '';

  if(fk){
    var sel = '[data-fk="'+fk+'"]' + (fid ? '[data-id="'+fid+'"]' : '');
    var el = document.querySelector(sel);
    if(el){
      el.focus();
      if(selS!=null && el.setSelectionRange){ try{ el.setSelectionRange(selS, selE); }catch(e){} }
    }
  }
  save();
}
var toastTimer = null;
function toast(msg){
  $toast.innerHTML = '<div class="toast" role="status">'+esc(msg)+'</div>';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ $toast.innerHTML = ''; }, 2600);
}

/* ===========================================================
   14. Events
   =========================================================== */
document.addEventListener('click', function(ev){
  var el = ev.target.closest ? ev.target.closest('[data-nav],[data-lang],[data-mg],[data-sold],[data-edit],[data-close],[data-verify],[data-revert],[data-bill],[data-rg],[data-rs],[data-dishall]') : null;
  if(!el) return;
  var g = function(k){ return el.getAttribute(k); };

  if(g('data-nav')){ state.nav = g('data-nav'); state.open = null; state.dishAll = false; render(); window.scrollTo(0,0); return; }
  if(g('data-lang')){ state.lang = g('data-lang'); render(); return; }
  if(g('data-mg')){ state.mgroup = g('data-mg'); render(); return; }
  if(g('data-rg')){ state.rgroup = g('data-rg'); state.dishAll = false; render(); return; }
  if(g('data-rs')){ state.rsort = g('data-rs'); render(); return; }
  if(g('data-dishall')){ state.dishAll = !state.dishAll; render(); return; }
  if(g('data-bill')){ var i = +g('data-bill'); state.billOpen = (state.billOpen===i ? null : i); render(); return; }
  if(g('data-edit')){ state.open = g('data-edit'); render(); return; }
  if(g('data-close')){ state.open = null; render(); return; }

  if(g('data-sold')){
    var id = g('data-sold'), it = ITEMBY[id];
    if(state.soldOut[id]) delete state.soldOut[id]; else state.soldOut[id] = true;
    render();
    toast(nmPrimary(it) + ' · ' + (state.soldOut[id] ? t('soldout') : t('instock')));
    return;
  }
  if(g('data-verify')){
    var vid = g('data-verify'), vit = ITEMBY[vid];
    if(state.verified[vid]) delete state.verified[vid]; else state.verified[vid] = true;
    render();
    toast(nmPrimary(vit) + ' · ' + (state.verified[vid] ? t('verified') : t('notreviewed')));
    return;
  }
  if(g('data-revert')){
    delete state.edits[g('data-revert')];
    render();
    return;
  }
});

document.addEventListener('input', function(ev){
  var el = ev.target, fk = el.getAttribute && el.getAttribute('data-fk');
  if(!fk) return;
  if(fk === 'q'){ state.q = el.value; render(); return; }
  if(fk === 'soldonly'){ state.soldOnly = el.checked; render(); return; }
  if(fk.indexOf('e-') === 0){
    var id = el.getAttribute('data-id'), it = ITEMBY[id];
    if(!it) return;
    var e = state.edits[id] || (state.edits[id] = {});
    if(fk === 'e-th') e.th = el.value;
    if(fk === 'e-en') e.en = el.value;
    if(fk === 'e-price'){ var v = el.value.trim(); e.price = v==='' ? null : Math.max(0, Math.round(parseFloat(v)*100)) || 0; }
    if(fk === 'e-rate'){ var r = el.value.trim(); e.rate = r==='' ? null : Math.max(0, Math.round(parseFloat(r)*100)) || 0; }
    render();
    return;
  }
});
document.addEventListener('change', function(ev){
  var el = ev.target, fk = el.getAttribute && el.getAttribute('data-fk');
  if(fk === 'mcat'){ state.mcat = el.value; render(); }
});
document.addEventListener('keydown', function(ev){
  if(ev.key === 'Escape' && state.open){ state.open = null; render(); }
});

render();
})();
