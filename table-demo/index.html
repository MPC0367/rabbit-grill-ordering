<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Order from your table at Rabbit Grill Khao Yai: scan, browse in Thai or English, send the order and follow it to the bill.">
<meta name="color-scheme" content="light dark">
<style>
  :root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; background: #faf9f7; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
<title>Rabbit Grill Table Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Noto+Sans+Thai:wght@400;500;600;700&family=Oswald:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme: light;
  --paper:#F3ECDD; --paper-2:#E9E0CB; --bone:#F8F4EA; --ink:#17150F; --ink-2:#221E16; --ink-3:#2E2921;
  --forest:#1E4230; --forest-2:#2C5A40; --oxblood:#6E1621; --taupe:#6B5E4B; --ember:#CB6234;
  --ember-ink:#A8441E; --steel:#8E8B82; --ink-soft:#5D574A; --ink-edge:#7A7264; --ink-numeral:#857D6F;
  --paper-hover:#EFE8D8; --forest-tint:#E3EAE2; --oxblood-tint:#EEE4DC; --ember-tint:#F3E2D4;
  --sage:#D5DDD4; --ash:#B9B2A2; --ash-2:#8F8878; --smoke:#37342E; --sage-light:#9FC4AA;
  --rose-light:#E59C90; --ember-light:#E08A5E; --forest-night:#223127; --oxblood-night:#3A1B1C; --ember-night:#3A2419;

  --canvas:var(--paper); --surface:var(--bone); --sunken:var(--paper-2); --hover:var(--paper-hover);
  --text:var(--ink); --text-2:var(--ink-soft); --text-3:var(--taupe); --numeral:var(--ink-numeral);
  --rule:rgba(23,21,15,.14); --rule-soft:rgba(23,21,15,.08); --rule-strong:rgba(23,21,15,.26);
  --rule-ink:var(--ink); --edge:var(--ink-edge); --leader:var(--steel);
  --action:var(--forest); --action-hover:var(--forest-2); --on-action:var(--bone); --on-action-2:var(--sage);
  --action-text:var(--forest); --selected:var(--forest-tint); --selected-edge:var(--forest);
  --ok:var(--forest); --ok-tint:var(--forest-tint); --alert:var(--oxblood); --alert-tint:var(--oxblood-tint);
  --on-alert:var(--bone); --heat-text:var(--ember-ink); --heat-tint:var(--ember-tint);
  --now:var(--ember); --now-text:var(--ember-ink);
  --inverse:var(--ink); --on-inverse:var(--bone); --on-inverse-2:var(--ash);
  --focus:var(--ember); --scrim:rgba(23,21,15,.56); --image-mat:var(--bone);

  --plate-a1:#D9C6AC; --plate-b1:#B99C78; --plate-a2:#CFC0A6; --plate-b2:#A98F6E;
  --plate-a3:#D8C7B4; --plate-b3:#AE8D74; --plate-a4:#CEC7AE; --plate-b4:#9E9472;
  --plate-a5:#DCC9B6; --plate-b5:#B08A6D; --plate-a6:#C8C3B2; --plate-b6:#9A907A;
  --plate-ink:#3A2E22;

  --font-ui:"Noto Sans Thai","Leelawadee UI",Thonburi,"Helvetica Neue",Arial,sans-serif;
  --font-display:"Oswald","Noto Sans Thai","Arial Narrow",sans-serif;
  --font-serif:"Cormorant Garamond","Noto Sans Thai",Georgia,"Times New Roman",serif;
  --num:"tnum" 1,"lnum" 1;

  --fs-12:.75rem; --fs-13:.8125rem; --fs-14:.875rem; --fs-15:.9375rem; --fs-16:1rem; --fs-17:1.0625rem;
  --fs-18:1.125rem; --fs-20:1.25rem; --fs-22:1.375rem; --fs-24:1.5rem; --fs-26:1.625rem; --fs-28:1.75rem;
  --fs-32:2rem; --fs-40:2.5rem; --fs-48:3rem;
  --lh-thai:1.6; --lh-thai-min:1.55; --lh-latin:1.45;

  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px; --space-8:32px;
  --gutter:16px; --radius-hair:2px; --radius-sm:4px; --radius-ctl:6px; --radius-card:8px; --radius-sheet:16px; --radius-pill:999px;
  --shadow-card:0 1px 0 rgba(23,21,15,.04),0 1px 3px rgba(23,21,15,.06);
  --shadow-sheet:0 -10px 30px rgba(23,21,15,.22);
  --shadow-float:0 6px 18px -4px rgba(23,21,15,.24);
  --shadow-page:0 0 40px -12px rgba(23,21,15,.25);
  --tap:44px; --control-h:44px; --control-h-lg:52px; --nav-h:64px;
  --ease-out:cubic-bezier(.2,.7,.3,1); --ease-sheet:cubic-bezier(.32,.72,0,1);
  --dur-fast:160ms; --dur-base:200ms; --dur-sheet:240ms; --sheet-travel:24px; --press-scale:.97;
  --col:440px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --canvas:var(--ink); --surface:var(--ink-2); --sunken:var(--ink-3); --hover:var(--smoke);
    --text:var(--bone); --text-2:var(--ash); --text-3:var(--ash-2); --numeral:var(--ash-2);
    --rule:rgba(248,244,234,.14); --rule-soft:rgba(248,244,234,.08); --rule-strong:rgba(248,244,234,.28);
    --rule-ink:var(--bone); --edge:var(--ash-2); --leader:var(--steel);
    --action-text:var(--sage-light); --selected:var(--forest-night); --selected-edge:var(--sage-light);
    --ok:var(--sage-light); --ok-tint:var(--forest-night); --alert:var(--rose-light); --alert-tint:var(--oxblood-night);
    --heat-text:var(--ember-light); --heat-tint:var(--ember-night); --now-text:var(--ember-light);
    --inverse:var(--bone); --on-inverse:var(--ink); --on-inverse-2:var(--ink-soft);
    --image-mat:var(--ink-3); --scrim:rgba(0,0,0,.66);
    --shadow-card:0 0 0 1px rgba(248,244,234,.06);
    --shadow-sheet:0 -10px 30px rgba(0,0,0,.55);
    --shadow-float:0 6px 18px -4px rgba(0,0,0,.6);
    --shadow-page:0 0 40px -8px rgba(0,0,0,.72);
    --plate-a1:#4A3B2C; --plate-b1:#2E2419; --plate-a2:#473C2C; --plate-b2:#2B2318;
    --plate-a3:#4C3C30; --plate-b3:#2F241C; --plate-a4:#44412F; --plate-b4:#29271B;
    --plate-a5:#4E3B2E; --plate-b5:#30231A; --plate-a6:#413E33; --plate-b6:#27251E;
    --plate-ink:#E3D6C4;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --canvas:var(--ink); --surface:var(--ink-2); --sunken:var(--ink-3); --hover:var(--smoke);
  --text:var(--bone); --text-2:var(--ash); --text-3:var(--ash-2); --numeral:var(--ash-2);
  --rule:rgba(248,244,234,.14); --rule-soft:rgba(248,244,234,.08); --rule-strong:rgba(248,244,234,.28);
  --rule-ink:var(--bone); --edge:var(--ash-2); --leader:var(--steel);
  --action-text:var(--sage-light); --selected:var(--forest-night); --selected-edge:var(--sage-light);
  --ok:var(--sage-light); --ok-tint:var(--forest-night); --alert:var(--rose-light); --alert-tint:var(--oxblood-night);
  --heat-text:var(--ember-light); --heat-tint:var(--ember-night); --now-text:var(--ember-light);
  --inverse:var(--bone); --on-inverse:var(--ink); --on-inverse-2:var(--ink-soft);
  --image-mat:var(--ink-3); --scrim:rgba(0,0,0,.66);
  --shadow-card:0 0 0 1px rgba(248,244,234,.06);
  --shadow-sheet:0 -10px 30px rgba(0,0,0,.55);
  --shadow-float:0 6px 18px -4px rgba(0,0,0,.6);
  --shadow-page:0 0 40px -8px rgba(0,0,0,.72);
  --plate-a1:#4A3B2C; --plate-b1:#2E2419; --plate-a2:#473C2C; --plate-b2:#2B2318;
  --plate-a3:#4C3C30; --plate-b3:#2F241C; --plate-a4:#44412F; --plate-b4:#29271B;
  --plate-a5:#4E3B2E; --plate-b5:#30231A; --plate-a6:#413E33; --plate-b6:#27251E;
  --plate-ink:#E3D6C4;
}
@media (prefers-reduced-motion: reduce){
  :root{--dur-fast:1ms; --dur-base:1ms; --dur-sheet:1ms; --sheet-travel:0px; --press-scale:1;}
}

*{box-sizing:border-box}
body{background:var(--canvas); color:var(--text); font:400 var(--fs-16)/var(--lh-thai) var(--font-ui);
  margin:0; -webkit-text-size-adjust:100%; overflow-x:hidden;}
button,input,textarea{font:inherit; color:inherit}
button{background:none; border:0; cursor:pointer; text-align:left}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:var(--radius-sm)}
.sr{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0}

/* ---------- shell ---------- */
#col{max-width:var(--col); margin:0 auto; min-height:100vh; background:var(--canvas); position:relative;
  box-shadow:0 0 0 1px var(--rule-soft);}
@media (min-width:600px){ body{background:var(--sunken)} #col{box-shadow:var(--shadow-page),0 0 0 1px var(--rule)} }
#app{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 28px)}
.gut{padding-left:var(--gutter); padding-right:var(--gutter)}

.mast{position:sticky; top:0; z-index:20; background:var(--canvas);
  box-shadow:0 1px 0 var(--rule-ink),0 4px 0 var(--canvas),0 5px 0 var(--rule-strong),0 5px 0 var(--canvas);}
.mast-in{display:flex; align-items:center; gap:var(--space-2); min-height:60px; padding:0 var(--gutter)}
.tag{border:1px solid var(--rule-ink); border-radius:var(--radius-hair); padding:4px 8px 5px; line-height:1;
  display:flex; flex-direction:column; gap:2px; align-items:center; flex:0 0 auto}
.tag b{font:500 var(--fs-20)/1 var(--font-display); font-feature-settings:var(--num); letter-spacing:.01em}
.tag i{font-style:normal; font-size:var(--fs-12); color:var(--text-2); line-height:1}
.mark{flex:1 1 auto; text-align:center; min-width:0}
.mark b{display:block; font:600 var(--fs-16)/1 var(--font-serif); letter-spacing:.18em; text-transform:uppercase; white-space:nowrap; text-indent:.18em}
.mark i{display:block; font:500 var(--fs-12)/1 var(--font-display); letter-spacing:.3em; color:var(--text-2); margin-top:5px; font-style:normal; text-transform:uppercase; text-indent:.3em}
.lang{display:flex; border:1px solid var(--rule-ink); border-radius:var(--radius-hair); overflow:hidden; flex:0 0 auto}
.lang button{padding:9px 11px; font:500 var(--fs-14)/1 var(--font-ui); color:var(--text-2); min-height:40px}
.lang button[aria-pressed="true"]{background:var(--inverse); color:var(--on-inverse)}

.demo{display:flex; gap:var(--space-3); padding:var(--space-3) var(--gutter); background:var(--sunken);
  border-bottom:1px dashed var(--rule-strong); align-items:flex-start}
.demo svg{flex:0 0 auto; margin-top:2px; color:var(--text-2)}
.demo p{margin:0; font-size:var(--fs-14); line-height:var(--lh-thai); color:var(--text-2)}
.demo b{color:var(--text); font-weight:600}

.kick{font:500 var(--fs-13)/1.3 var(--font-display); letter-spacing:.06em; color:var(--text-3); text-transform:none}
.ptitle{font:600 var(--fs-26)/var(--lh-thai-min) var(--font-ui); margin:var(--space-1) 0 0}
.ptitle .en{font:italic 500 var(--fs-20)/1.2 var(--font-serif); color:var(--text-3); margin-left:8px}
.lede{color:var(--text-2); font-size:var(--fs-15); margin:var(--space-2) 0 0}
.head{padding-top:var(--space-5); padding-bottom:var(--space-4)}

/* ---------- nav ---------- */
#nav{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:min(var(--col),100%); z-index:30;
  background:var(--surface); border-top:1px solid var(--rule); padding-bottom:env(safe-area-inset-bottom,0px);
  display:grid; grid-template-columns:repeat(4,1fr)}
#nav button{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  min-height:var(--nav-h); color:var(--text-2); font:500 var(--fs-13)/1.4 var(--font-ui); position:relative; padding:6px 2px}
#nav button[aria-current="page"]{color:var(--text)}
#nav button[aria-current="page"]::after{content:""; position:absolute; top:6px; left:50%; transform:translateX(-50%);
  width:26px; height:3px; border-radius:2px; background:var(--now)}
.badge{position:absolute; top:6px; left:calc(50% + 10px); min-width:20px; height:20px; padding:0 5px;
  border-radius:var(--radius-pill); background:var(--inverse); color:var(--on-inverse);
  font:500 var(--fs-12)/20px var(--font-display); font-feature-settings:var(--num); text-align:center}

/* ---------- cards, rules ---------- */
.card{background:var(--surface); border:1px solid var(--rule); border-radius:var(--radius-card);
  box-shadow:var(--shadow-card); padding:var(--space-4); margin-top:var(--space-4)}
.card h3{margin:0 0 var(--space-3); font:600 var(--fs-18)/var(--lh-thai) var(--font-ui)}
.secthead{display:flex; align-items:baseline; gap:var(--space-3); margin-top:var(--space-6)}
.secthead h2{margin:0; font:600 var(--fs-24)/var(--lh-thai-min) var(--font-ui); flex:0 0 auto}
.secthead .en{font:italic 500 var(--fs-20)/1.2 var(--font-serif); color:var(--text-3); margin-left:auto; text-align:right}
.sectno{display:flex; align-items:center; gap:var(--space-3); margin-top:var(--space-8)}
.sectno span{font:500 var(--fs-12)/1.2 var(--font-display); letter-spacing:.14em; color:var(--text-2)}
.sectno hr{flex:1; border:0; border-top:1px solid var(--rule); margin:0}
.note{color:var(--text-2); font-size:var(--fs-14); margin:var(--space-2) 0 0}
.hint{color:var(--text-3); font-size:var(--fs-13); margin:var(--space-2) 0 0}

/* ---------- leader line ---------- */
.lead{display:flex; align-items:baseline; gap:0; width:100%; min-width:0}
.lead .nm{flex:0 1 auto; min-width:0; overflow-wrap:anywhere}
.lead .dots{flex:1 1 auto; min-width:14px; border-bottom:2px dotted var(--leader); margin:0 6px; transform:translateY(-5px); align-self:flex-end; height:0}
.lead .amt{flex:0 0 auto; font:500 var(--fs-20)/1 var(--font-display); font-feature-settings:var(--num); white-space:nowrap}
.amt-sm{font:500 var(--fs-16)/1 var(--font-display); font-feature-settings:var(--num)}
.amt-lg{font:500 var(--fs-26)/1 var(--font-display); font-feature-settings:var(--num)}

/* ---------- buttons ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:var(--control-h);
  padding:0 var(--space-4); border-radius:var(--radius-ctl); font:600 var(--fs-15)/1.3 var(--font-ui);
  transition:background var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out)}
.btn:active{transform:scale(var(--press-scale))}
.btn-p{background:var(--action); color:var(--on-action); width:100%; min-height:var(--control-h-lg)}
.btn-p:hover{background:var(--action-hover)}
.btn-o{border:1px solid var(--edge); color:var(--action-text); background:var(--surface)}
.btn-o:hover{background:var(--hover)}
.btn-g{border:1px solid var(--edge); color:var(--text); background:var(--surface); width:100%}
.btn[disabled]{opacity:.55; cursor:default; transform:none}
.btn-txt{color:var(--action-text); font-weight:600; font-size:var(--fs-15); text-decoration:underline; text-underline-offset:3px; padding:8px 0; min-height:var(--tap)}

.pill{display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:var(--radius-pill);
  font:600 var(--fs-13)/1.4 var(--font-ui)}
.pill-n{background:var(--sunken); color:var(--text)}
.pill-ok{background:var(--ok-tint); color:var(--ok)}
.pill-h{background:var(--heat-tint); color:var(--heat-text)}
.pill-a{background:var(--alert-tint); color:var(--alert)}
.chip-ink{background:var(--inverse); color:var(--on-inverse); border-radius:var(--radius-sm); padding:3px 8px; font:600 var(--fs-13)/1.4 var(--font-ui)}
.dot{width:8px; height:8px; border-radius:50%; background:currentColor; flex:0 0 auto}

/* ---------- search + tabs ---------- */
.srow{display:flex; gap:var(--space-2); padding:var(--space-3) var(--gutter) var(--space-2); background:var(--canvas)}
.sbox{flex:1 1 auto; display:flex; align-items:center; gap:8px; border:1px solid var(--edge);
  border-radius:var(--radius-ctl); background:var(--surface); padding:0 10px; min-height:var(--control-h); min-width:0}
.sbox svg{flex:0 0 auto; color:var(--text-2)}
.sbox input{flex:1 1 auto; min-width:0; border:0; background:none; outline:none; font-size:var(--fs-16); padding:10px 0}
.seg{display:flex; border:1px solid var(--edge); border-radius:var(--radius-ctl); background:var(--sunken); overflow:hidden; flex:0 0 auto}
.seg button{padding:0 12px; min-height:var(--control-h); font:600 var(--fs-15)/1 var(--font-ui); color:var(--text-2); white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--text); box-shadow:0 0 0 1px var(--edge)}

.tabs{position:sticky; top:60px; z-index:19; background:var(--canvas); border-bottom:1px solid var(--rule)}
.tabs-in{display:flex; align-items:stretch; gap:0; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch}
.tabs-in::-webkit-scrollbar{display:none}
.tabs button{display:flex; align-items:center; gap:7px; padding:0 13px; min-height:52px; white-space:nowrap;
  font:500 var(--fs-15)/1 var(--font-ui); color:var(--text-2); position:relative}
.tabs button:first-child{padding-left:var(--gutter)}
.tabs button[aria-current="true"]{color:var(--text); font-weight:600}
.tabs button[aria-current="true"]::after{content:""; position:absolute; left:13px; right:13px; bottom:0; height:3px; background:var(--now)}
.tabs .no{font:500 var(--fs-13)/1 var(--font-display); letter-spacing:.06em; color:var(--numeral); font-feature-settings:var(--num)}
.catlist{border-bottom:1px solid var(--rule); background:var(--surface); padding:var(--space-2) 0}
.catlist button{display:flex; width:100%; align-items:baseline; gap:10px; padding:10px var(--gutter); min-height:var(--tap)}
.catlist button:hover{background:var(--hover)}
.catlist .n{font:500 var(--fs-13)/1 var(--font-display); color:var(--numeral); font-feature-settings:var(--num); flex:0 0 22px}
.catlist .c{margin-left:auto; color:var(--text-3); font-size:var(--fs-13)}

/* ---------- dish rows ---------- */
.rows{margin-top:var(--space-3)}
.row{display:flex; gap:12px; padding:var(--space-5) 0; border-top:1px solid var(--rule); align-items:flex-start; width:100%}
.rows .row:first-child{border-top:0}
.row:hover{background:var(--hover)}
.plate{flex:0 0 auto; width:clamp(96px,28vw,112px); aspect-ratio:4/3; border-radius:var(--radius-hair);
  display:grid; place-items:center; box-shadow:0 0 0 3px var(--image-mat),0 0 0 4px var(--rule); margin:4px}
.plate span{font:italic 600 var(--fs-28)/1 var(--font-serif); color:var(--plate-ink); opacity:.5}
.plate.has-photo,.thumb.has-photo{overflow:hidden; background:var(--sunken)}
.plate img,.thumb img{width:100%; height:100%; object-fit:cover; display:block; border-radius:inherit}
.pl1{background:linear-gradient(135deg,var(--plate-a1),var(--plate-b1))}
.pl2{background:linear-gradient(135deg,var(--plate-a2),var(--plate-b2))}
.pl3{background:linear-gradient(135deg,var(--plate-a3),var(--plate-b3))}
.pl4{background:linear-gradient(135deg,var(--plate-a4),var(--plate-b4))}
.pl5{background:linear-gradient(135deg,var(--plate-a5),var(--plate-b5))}
.pl6{background:linear-gradient(135deg,var(--plate-a6),var(--plate-b6))}
.rbody{flex:1 1 auto; min-width:0}
.rkick{display:flex; align-items:center; gap:6px; color:var(--text-2); font-size:var(--fs-13); margin-bottom:3px}
.rname{font:600 var(--fs-17)/var(--lh-thai) var(--font-ui)}
.ren{font:italic 500 var(--fs-17)/1.25 var(--font-serif); color:var(--text-3); margin-top:2px}
.rper{font:400 var(--fs-13)/1.4 var(--font-ui); color:var(--text-2); text-align:right; margin-top:2px}
.ract{display:flex; justify-content:flex-end; margin-top:var(--space-3)}
.row.off .rname,.row.off .lead .amt{color:var(--text-2)}
.row.off .plate{opacity:.55}
.rwhy{display:flex; gap:7px; align-items:flex-start; margin-top:var(--space-2); color:var(--alert); font-size:var(--fs-13); line-height:var(--lh-thai)}
.rwhy svg{flex:0 0 auto; margin-top:2px}

/* ---------- stepper ---------- */
.step{display:inline-flex; align-items:center; border:1px solid var(--edge); border-radius:var(--radius-ctl);
  background:var(--selected); overflow:hidden; flex:0 0 auto}
.step button{width:46px; min-height:var(--control-h); display:grid; place-items:center; font-size:var(--fs-20); color:var(--text)}
.step button[disabled]{color:var(--text-3)}
.step b{min-width:34px; text-align:center; font:500 var(--fs-18)/1 var(--font-display); font-feature-settings:var(--num)}

/* ---------- sheet ---------- */

var TH={}, EN={};
for (var i=0;i<D.length;i++){ TH[D[i][0]]=D[i][1]; EN[D[i][0]]=D[i][2]; }

var TABLE = '07';
var NOTE_MAX = 140;
var MAX_QTY = 20;

/* ------------------------------------------------------------------ state */
var S = {
  lang:'th', screen:'join', joined:false, browsing:false,
  group:'food', cat:null, catsOpen:false, q:'',
  draft:[], rounds:[], portions:[], reqs:{}, billAt:null,
  sheet:null, measure:true, now:Date.now(), uid:1, roundNo:0
};

/* ------------------------------------------------------------------ helpers */
function t(k,v){
  var s = (S.lang==='th'?TH:EN)[k];
  if (s==null) return k;
  if (v) for (var p in v) s = s.split('{'+p+'}').join(v[p]);
  return s;
}
function esc(x){
  return String(x==null?'':x).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function baht(satang){
  var neg = satang<0, v = Math.abs(satang);
  var whole = Math.floor(v/100), frac = v%100;
  var s = whole.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  if (frac) s += '.' + (frac<10?'0':'') + frac;
  return (neg?'-':'') + '฿' + s;
}
function fmtTime(ts){
  var d = new Date(ts);
  var h = d.getHours(), m = d.getMinutes();
  return (h<10?'0':'')+h+':'+(m<10?'0':'')+m;
}
function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } }

/* ------------------------------------------------------------------ catalog index */
var ITEM = {}, CAT = {};
C.items.forEach(function(it){ ITEM[it.id]=it; });
C.categories.forEach(function(c){ CAT[c.id]=c; c.items=[]; });
C.items.forEach(function(it){ if (CAT[it.cat]) CAT[it.cat].items.push(it); });
C.categories.forEach(function(c){ c.items.sort(function(a,b){ return a.sort-b.sort; }); });
var GROUP = { food:[], drinks:[] };
C.categories.forEach(function(c){
  if (!c.items.length) return;
  var bar = c.items.filter(function(i){ return i.station==='bar'; }).length;
  (bar > c.items.length/2 ? GROUP.drinks : GROUP.food).push(c);
});
GROUP.food.sort(function(a,b){ return a.sort-b.sort; });
GROUP.drinks.sort(function(a,b){ return a.sort-b.sort; });
GROUP.food.forEach(function(c,i){ c.no=i+1; });
GROUP.drinks.forEach(function(c,i){ c.no=i+1; });

var LINKS = {};
C.links.forEach(function(l){ (LINKS[l.item]=LINKS[l.item]||[]).push(l.group); });
var GRP = {}; C.groups.forEach(function(g){ GRP[g.id]=g; g.options=[]; });
C.options.forEach(function(o){ if (GRP[o.group]) GRP[o.group].options.push(o); });
C.groups.forEach(function(g){ g.options.sort(function(a,b){ return a.sort-b.sort; }); });

function nameOf(it){
  if (S.lang==='th') return it.th || it.en;
  return it.en || it.th;
}
function altOf(it){
  if (!it.th || !it.en) return '';
  return S.lang==='th' ? it.en : it.th;
}
function catName(c){ return (S.lang==='th' ? (c.th||c.en) : (c.en||c.th)); }
function catAlt(c){ if (!c.th || !c.en) return ''; return S.lang==='th' ? c.en : c.th; }
function isMeasured(it){ return it.kind==='measured_weight' || it.kind==='measured'; }
function plateClass(key){
  var h=0; for (var i=0;i<key.length;i++) h=(h*31+key.charCodeAt(i))>>>0;
  return 'pl'+(h%6+1);
}
function photoUrl(it,w){ return "../media/dish/"+it.img+"-"+w+".webp"; }
/* The restaurant photographed 35 of its dishes; the rest keep the engraved
   initial rather than borrowing a stock photo of someone else food. */
function plateInner(it,big){
  if (!it.img) return "<span"+(big?" style=\"font-size:var(--fs-48)\"":"")+">"+esc(initial(it))+"</span>";

/* ------------------------------------------------------------------ orders */
var STEPS = ['received','confirmed','preparing','almost','served'];
function stepLabel(k,station){
  if (k==='received') return t('stRecv');
  if (k==='confirmed') return t('stConf');
  if (k==='preparing') return station==='bar' ? t('stPrep') : t('stCook');
  if (k==='almost') return t('stAlmost');
  return t('stServed');
}
function newRef(){
  var A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789', s='';
  for (var i=0;i<4;i++) s += A.charAt(Math.floor(Math.random()*A.length));
  return 'RG-'+s;
}
function schedule(from, station){
  /* Simulated step gaps, in ms. Each gap is over a minute, so no two steps
     ever stamp the same clock minute, and each is a different length -- the
     cooking step is the long one. A round lands in roughly 4 to 5 minutes,
     the bar a little quicker than the kitchen. */
  var gaps = station==='bar'
    ? [[61000,4000],[61000,6000],[62000,8000],[61000,4000]]
    : [[61000,5000],[62000,7000],[65000,13000],[61000,6000]];
  var out = [from];
  for (var i=0;i<4;i++){
    out.push(out[i] + gaps[i][0] + Math.floor(Math.random()*gaps[i][1]));
  }
  return out;
}
function lineStep(line, now){
  var n = 0;
  for (var i=0;i<line.sched.length;i++) if (now >= line.sched[i]) n = i;
  return n;
}
function roundStep(r, now){
  var m = 4;
  r.lines.forEach(function(l){ m = Math.min(m, lineStep(l, now)); });
  return m;
}
function lineAmount(l){ return l.unit * l.qty; }
function draftTotal(){
  var s=0; S.draft.forEach(function(l){ s += lineAmount(l); }); return s;
}
function draftCount(){
  var n=0; S.draft.forEach(function(l){ n += l.qty; }); return n;
}
function acceptedTotal(){
  var s=0;
  S.rounds.forEach(function(r){
    if (roundStep(r, S.now) < 1) return;
    r.lines.forEach(function(l){ s += lineAmount(l); });
  });
  return s;
}
function pendingLines(){
  var out=[];
  S.rounds.forEach(function(r){ if (roundStep(r, S.now) < 1) out = out.concat(r.lines); });
  return out;
}

/* ------------------------------------------------------------------ seed
   One round already sent from another phone at this table, before this
   device scanned the QR card. Values come straight from the catalog. */
(function seed(){
  function find(key){ for (var k in ITEM) if (ITEM[k].key===key) return ITEM[k]; return null; }
  var t0 = Date.now() - 22*60000;
  var picks = [['nashville-hot-chicken',1],['grilled-fish',1],['pepsi-original',2]];
  var lines = [];
  picks.forEach(function(p){
    var it = find(p[0]); if (!it) return;
    var sch = [t0, t0+95000, t0+150000, t0+430000, t0+620000];
    lines.push({ uid:'s'+(S.uid++), itemId:it.id, qty:p[1], unit:it.price, note:'', allergy:false, opt:null, sched:sch, mine:false });
  });
  if (lines.length){
    S.roundNo = 1;
    S.rounds.push({ n:1, ref:'RG-EDMG', at:t0, lines:lines, mine:false });
  }
})();

try{
  var sl = store('rg.lang'); if (sl==='th'||sl==='en') S.lang = sl;
  var sd = store('rg.draft');

    if (arr && arr.length) arr.forEach(function(l){

        unit:it.price, note:String(l.note||'').slice(0,NOTE_MAX), allergy:!!l.allergy, opt:l.opt||null });
    });
  }
}catch(e){}

function matches(it,q){
  if (!q) return true;
  var a = (it.th||'')+' '+(it.en||'');

}

  var ok = canOrder(it);

  h += '<span class="lead"><span class="nm rname">'+esc(nameOf(it))+'</span><span class="dots"></span>';
  if (meas && it.rate!=null) h += '<span class="amt">'+baht(it.rate)+'</span>';
  else if (it.price!=null) h += '<span class="amt">'+baht(it.price)+'</span>';
  else h += '<span class="amt amt-sm" style="color:var(--text-2)">'+esc(t('pricePending'))+'</span>';

/* ------------------------------------------------------------------ requests */
function reqBusy(kind){
  var r = S.reqs[kind];
  if (!r) return false;
  if (r.state !== 'done') return true;
  return S.now < r.until;
}
function sendReq(kind, note){
  if (reqBusy(kind)) return false;
  var now = Date.now();
  S.reqs[kind] = { state:'sent', at:now, ackAt:now+7000, doneAt:now+15000, until:now+35000, note:note||'' };
  if (kind === 'bill' && !S.billAt) S.billAt = now;
  return true;
}
function reqName(kind){
  return kind==='call_staff' ? t('svcCall') : kind==='bill' ? t('svcBill')
       : kind==='order_change' ? t('svcChange') : t('svcAllergy');
}
function reqStatusLine(kind){
  var r = S.reqs[kind];
  if (!r) return '';
  if (r.state==='sent') return t('helpSent',{time:fmtTime(r.at)});
  if (r.state==='ack') return kind==='call_staff' ? t('helpAckCall') : t('helpAck');
  var left = Math.max(0, Math.ceil((r.until - S.now)/1000));
  return left>0 ? t('helpDoneWait',{time:fmtTime(r.doneAt),n:left}) : t('helpDone',{time:fmtTime(r.doneAt)});
}

            : kind==='bill' ? t('subBill') : kind==='order_change' ? t('subChange') : t('subAllergy'));
  var act = (kind==='call_staff'||kind==='bill') ? 'req' : 'helpopen';
  return '<button class="srow2'+(r&&r.state!=='done'?' sel':'')+'" data-act="'+act+'" data-v="'+kind+'"'+(busy&&act==='req'?' disabled':'')+'>'
    + '<span class="ic">'+ic(icon,20)+'</span>'
    + '<span class="tx"><b>'+esc(reqName(kind))+'</b><small>'+esc(sub)+'</small></span>'
    + '<span class="ar">'+ic('chev',18)+'</span></button>';
}
function serviceSheet(){
  if (S.sheet.help){
    var kind = S.sheet.help;
    var r = S.reqs[kind];
    var h = '<div class="grab"></div><div class="sh-h"><span class="t">'+esc(reqName(kind))+'</span>'
      + '<button class="iconbtn x" data-act="closeSheet" aria-label="'+esc(t('close'))+'">'+ic('x',20)+'</button></div><div class="sh-b">'
      + '<p style="margin:0 0 4px"><button class="btn-txt" data-act="helpback">&lsaquo; '+esc(t('helpBack'))+'</button></p>'
      + '<p class="note">'+esc(kind==='order_change'?t('helpLeadChange'):t('helpLeadAllergy'))+'</p>';
    if (r){
      h += '<div class="card"><p class="pill '+(r.state==='done'?'pill-ok':'pill-h')+'" style="margin:0 0 8px">'
        + (r.state==='done'?ic('check',14):'<i class="dot"></i>')+esc(reqStatusLine(kind))+'</p>'
        + '<p class="note" style="margin:0">'+esc(r.state==='sent'?t('helpExisting'):t('helpExistingSeen'))+'</p>'
        + (r.note ? '<div class="notebox"><b>'+esc(t('portYourNote'))+'</b>'+esc(r.note)+'</div>' : '')
        + '</div>';
    } else {
      h += '<p class="lbl">'+esc(kind==='order_change'?t('helpNoteChange'):t('helpNoteAllergy'))+' <i>'+esc(t('optional'))+'</i></p>'
        + '<div class="tawrap"><textarea class="ta" id="hn" maxlength="'+NOTE_MAX+'">'+esc(SH.pnote)+'</textarea>'
        + '<span class="cnt" id="hnc">'+SH.pnote.length+' / '+NOTE_MAX+'</span></div>'
        + '<p class="hint">'+esc(t('helpNoteHelp'))+'</p>';
    }
    h += '</div><div class="sh-f">';
    h += r ? '<button class="btn btn-p" data-act="closeSheet">'+esc(t('close'))+'</button>'
           : '<button class="btn btn-p" data-act="helpsend" data-v="'+kind+'">'+esc(kind==='order_change'?t('helpSendChange'):t('helpSendAllergy'))+'</button>';
    return h + '</div>';
  }

  var h = '<div class="grab"></div><div class="sh-h"><span class="t">'+esc(t('serviceAt',{label:TABLE}))+'</span>'
    + '<button class="iconbtn" data-act="lang" data-v="'+(S.lang==='th'?'en':'th')+'" aria-label="'+esc(t('langTo'))+'"><span style="font:600 var(--fs-14)/1 var(--font-ui)">'+(S.lang==='th'?'EN':'TH')+'</span></button>'
    + '<button class="iconbtn x" data-act="closeSheet" aria-label="'+esc(t('close'))+'">'+ic('x',20)+'</button></div><div class="sh-b">'
    + svcRow('call_staff','bell')
    + svcRow('order_change','note')
    + svcRow('allergy_help','alert')
    + svcRow('bill','receipt')
    + '<button class="srow2" data-act="nav" data-v="bill"><span class="ic">'+ic('list',20)+'</span>'
    +   '<span class="tx"><b>'+esc(t('viewBill'))+'</b><small>'+esc(t('viewBillSub',{amount:baht(acceptedTotal())}))+'</small></span>'
    +   '<span class="ar">'+ic('chev',18)+'</span></button>'
    + '<p class="note" style="display:flex;gap:10px;align-items:flex-start;background:var(--sunken);padding:12px;border-radius:var(--radius-card);margin-top:16px">'
    +   ic('hand',18)+'<span>'+esc(t('svcFallback'))+'</span></p>'
    + '<p class="lbl">'+ic('info',16)+' '+esc(t('measureTitle'))+'</p>'
    + '<p class="note" style="margin-top:4px">'+esc(t('measureBody'))+'</p>'
    + '<div style="display:flex;align-items:center;gap:12px;margin:14px 0 8px">'
    +   '<button class="sw" data-act="measure" aria-pressed="'+(S.measure?'true':'false')+'" aria-label="'+esc(t('measureSwitch'))+'"></button>'
    +   '<span><b style="font:600 var(--fs-15)/1.4 var(--font-ui)">'+esc(t('measureSwitch'))+'</b> '
    +   '<span class="hint" style="display:inline">'+esc(S.measure?t('on'):t('off'))+'</span></span></div>'
    + '<div style="height:8px"></div></div>';
  return h;
}

/* ------------------------------------------------------------------ render */
var toastTimer = null;
function toast(msg){
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('on');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('on'); }, 4000);
}
function screenHTML(){
  if (S.screen==='join') return joinScreen();
  if (S.screen==='menu') return menuScreen();
  if (S.screen==='cart') return cartScreen();
  if (S.screen==='review') return reviewScreen();
  if (S.screen==='track') return trackScreen();
  return billScreen();
}
function render(){
  document.documentElement.lang = S.lang;
  var app = document.getElementById('app');
  var html = screenHTML();
  if (!S.joined && S.screen!=='join'){
    html += '<div class="joinbar"><button class="btn btn-p" data-act="join">'+esc(t('joinSubmit',{label:TABLE}))+'</button></div>'
          + '<div style="height:84px"></div>';
  }
  app.innerHTML = html;

  var nav = document.getElementById('nav');
  if (S.joined){ nav.innerHTML = navBar(); nav.setAttribute('aria-label', t('navLabel')); nav.hidden = false; }
  else { nav.innerHTML = ''; nav.hidden = true; }

  renderSheet();
  syncTabs();
}
function renderSheet(){
  var el = document.getElementById('sheet');
  var sc = document.getElementById('scrim');
  if (!S.sheet){
    el.classList.remove('on'); sc.classList.remove('on');
    setTimeout(function(){ if (!S.sheet){ el.hidden = true; el.innerHTML = ''; } }, 240);
    return;
  }
  el.innerHTML = S.sheet.type==='item' ? itemSheet() : serviceSheet();
  el.setAttribute('aria-label', S.sheet.type==='item' ? (ITEM[S.sheet.id] ? nameOf(ITEM[S.sheet.id]) : '') : t('serviceAt',{label:TABLE}));
  el.hidden = false;
  sc.classList.add('on');
  requestAnimationFrame(function(){ el.classList.add('on'); });
}
function syncTabs(){
  if (S.screen!=='menu' || S.q.trim()) return;
  var tabs = document.querySelectorAll('.tabs-in [data-act="cat"]');
  if (!tabs.length) return;
  var best = null, bestTop = -1e9;
  GROUP[S.group].forEach(function(c){
    var el = document.getElementById('sec-'+c.id);
    if (!el) return;
    var top = el.getBoundingClientRect().top - 130;
    if (top <= 0 && top > bestTop){ bestTop = top; best = c.id; }
  });
  if (!best) best = GROUP[S.group][0] && GROUP[S.group][0].id;
  if (best === S.cat) return;
  S.cat = best;
  for (var i=0;i<tabs.length;i++){
    tabs[i].setAttribute('aria-current', tabs[i].getAttribute('data-v')===best ? 'true' : 'false');
  }
}

/* ------------------------------------------------------------------ actions */
function openItem(id, editUid){
  var it = ITEM[id]; if (!it) return;
  S.sheet = { type:'item', id:id, editUid:editUid||null };
  if (editUid){
    var l = S.draft.filter(function(x){ return x.uid===editUid; })[0];
    SH = { qty:l.qty, note:l.note, allergy:l.allergy, opt:l.opt, grams:'', pnote:'' };
  } else {
    SH = { qty:1, note:'', allergy:false, opt:null, grams:'', pnote:'' };
  }
  render();
}
function closeSheet(){ S.sheet = null; render(); }

function addLine(){
  var it = ITEM[S.sheet.id];
  S.draft.push({ uid:'d'+(S.uid++), itemId:it.id, qty:SH.qty, unit:it.price,
    note:SH.note.trim().slice(0,NOTE_MAX), allergy:SH.allergy, opt:SH.opt });
  saveDraft();
  var name = nameOf(it);
  S.sheet = null; render();
  toast(SH.qty>1 ? t('addedQty',{name:name,n:SH.qty}) : t('added',{name:name}));
}
function saveLine(){
  var l = S.draft.filter(function(x){ return x.uid===S.sheet.editUid; })[0];
  if (l){ l.qty = SH.qty; l.note = SH.note.trim().slice(0,NOTE_MAX); l.allergy = SH.allergy; l.opt = SH.opt; }
  saveDraft();
  var name = nameOf(ITEM[S.sheet.id]);
  S.sheet = null; render(); toast(t('updated',{name:name}));
}
function removeLine(uid){
  var l = S.draft.filter(function(x){ return x.uid===uid; })[0];
  if (!l) return;
  var name = nameOf(ITEM[l.itemId]);
  S.draft = S.draft.filter(function(x){ return x.uid!==uid; });
  saveDraft();
  S.sheet = null; render(); toast(t('removed',{name:name}));
}
function placeOrder(){
  if (!S.draft.length) return;
  var now = Date.now();
  var r = { n:++S.roundNo, ref:newRef(), at:now, mine:true, lines:[] };
  S.draft.forEach(function(l){
    var it = ITEM[l.itemId];
    r.lines.push({ uid:l.uid, itemId:l.itemId, qty:l.qty, unit:l.unit, note:l.note,
      allergy:l.allergy, opt:l.opt, sched:schedule(now, it.station), mine:true });
  });
  S.rounds.push(r);
  S.draft = []; saveDraft();
  S.screen = 'track'; render();
  toast(t('subReceived',{ref:r.ref}));
  window.scrollTo(0,0);
}
function askWeigh(id){
  var it = ITEM[id];
  var g = parseInt(SH.grams,10);
  if (!(g>=50 && g<=2000)) g = 0;
  var now = Date.now();
  S.portions.push({ id:'p'+(S.uid++), itemId:id, grams:g||0, note:SH.pnote.trim().slice(0,NOTE_MAX),
    state:'requested', at:now, quoteAt:now+6500 });
  S.sheet = null; S.screen = 'track'; render();
  toast(t('portSentBody',{name:nameOf(it)}));
  window.scrollTo(0,0);
}
function acceptPortion(pid){
  var p = S.portions.filter(function(x){ return x.id===pid; })[0];
  if (!p || p.state!=='quoted') return;
  var it = ITEM[p.itemId];
  var now = Date.now();
  var r = { n:++S.roundNo, ref:newRef(), at:now, mine:true, fromPortion:true, lines:[
    { uid:'w'+(S.uid++), itemId:p.itemId, qty:1, unit:p.quoteAmount, note:p.note, allergy:false,
      opt:null, sched:schedule(now, it.station), mine:true }
  ]};
  S.rounds.push(r);
  S.portions = S.portions.filter(function(x){ return x.id!==pid; });
  render();
  toast(t('portConfirmedToast',{name:nameOf(it),round:r.n}));
}
function cancelPortion(pid){
  var p = S.portions.filter(function(x){ return x.id===pid; })[0];
  if (!p) return;
  var name = nameOf(ITEM[p.itemId]);
  S.portions = S.portions.filter(function(x){ return x.id!==pid; });
  render(); toast(t('portCancelled',{name:name}));
}

/* ------------------------------------------------------------------ events */
document.addEventListener('click', function(ev){
  var el = ev.target.closest ? ev.target.closest('[data-act]') : null;
  if (!el) return;
  var a = el.getAttribute('data-act'), v = el.getAttribute('data-v');
  if (el.disabled) return;

  if (a==='lang'){ S.lang = v; store('rg.lang', v); render(); return; }
  if (a==='join'){
    S.joined = true; S.browsing = false; S.sheet = null;
    if (S.screen==='join') S.screen = 'menu';
    render(); toast(t('joinToast',{label:TABLE})); window.scrollTo(0,0); return;
  }
  if (a==='browse'){ S.browsing = true; S.screen = 'menu'; render(); window.scrollTo(0,0); return; }
  if (a==='nav'){
    if (v==='service'){ S.sheet = { type:'service', help:null }; SH.pnote=''; render(); return; }
    S.screen = v; S.sheet = null; render(); window.scrollTo(0,0); return;
  }
  if (a==='open'){ openItem(v); return; }
  if (a==='closeSheet'){ closeSheet(); return; }
  if (a==='shqty'){
    var d = parseInt(el.getAttribute('data-d'),10);
    SH.qty = Math.max(1, Math.min(MAX_QTY, SH.qty + d));
    renderSheet(); return;
  }
  if (a==='opt'){ SH.opt = v || null; renderSheet(); return; }
  if (a==='add'){ addLine(); return; }
  if (a==='save'){ saveLine(); return; }
  if (a==='rm'){ removeLine(v); return; }
  if (a==='edit'){ openItem(S.draft.filter(function(x){return x.uid===v;})[0].itemId, v); return; }
  if (a==='qty'){
    var dd = parseInt(el.getAttribute('data-d'),10);
    var ln = S.draft.filter(function(x){ return x.uid===v; })[0];
    if (ln){ ln.qty = Math.max(1, Math.min(MAX_QTY, ln.qty + dd)); saveDraft(); render(); }
    return;
  }
  if (a==='review'){ S.screen = 'review'; render(); window.scrollTo(0,0); return; }
  if (a==='place'){ placeOrder(); return; }
  if (a==='weigh'){ askWeigh(v); return; }
  if (a==='paccept'){ acceptPortion(v); return; }
  if (a==='pcancel'){ cancelPortion(v); return; }
  if (a==='req'){
    if (sendReq(v)) { render(); toast(t('helpSentToast',{name:reqName(v)})); }
    else render();
    return;
  }
  if (a==='helpopen'){ S.sheet = { type:'service', help:v }; SH.pnote=''; render(); return; }
  if (a==='helpback'){ S.sheet = { type:'service', help:null }; render(); return; }
  if (a==='helpsend'){
    if (sendReq(v, SH.pnote.trim())) toast(t('helpSentToast',{name:reqName(v)}));
    render(); return;
  }
  if (a==='measure'){ S.measure = !S.measure; renderSheet(); return; }
  if (a==='group'){ S.group = v; S.cat = null; S.catsOpen = false; render(); window.scrollTo(0,0); return; }
  if (a==='togglecats'){ S.catsOpen = !S.catsOpen; render(); return; }
  if (a==='clearq'){ S.q = ''; render(); window.scrollTo(0,0); return; }
  if (a==='cat'){
    S.cat = v;
    var reRender = S.catsOpen; S.catsOpen = false;
    if (reRender) render();
    else {
      var tabs = document.querySelectorAll('.tabs-in [data-act="cat"]');
      for (var i=0;i<tabs.length;i++) tabs[i].setAttribute('aria-current', tabs[i].getAttribute('data-v')===v?'true':'false');
    }
    var sec = document.getElementById('sec-'+v);
    if (sec) sec.scrollIntoView({ behavior:'smooth', block:'start' });
    return;
  }
}, false);

document.addEventListener('input', function(ev){
  var id = ev.target.id;
  if (id==='q'){
    S.q = ev.target.value;
    var pos = ev.target.selectionStart;
    render();
    var q = document.getElementById('q');
    if (q){ q.focus(); try{ q.setSelectionRange(pos,pos); }catch(e){} }
    return;
  }
  if (id==='nt'){ SH.note = ev.target.value; var c=document.getElementById('ntc'); if(c) c.textContent = SH.note.length+' / '+NOTE_MAX; return; }
  if (id==='pn'){ SH.pnote = ev.target.value; var c2=document.getElementById('pnc'); if(c2) c2.textContent = SH.pnote.length+' / '+NOTE_MAX; return; }
  if (id==='hn'){ SH.pnote = ev.target.value; var c3=document.getElementById('hnc'); if(c3) c3.textContent = SH.pnote.length+' / '+NOTE_MAX; return; }
  if (id==='pg'){ SH.grams = ev.target.value; return; }
}, false);

document.addEventListener('change', function(ev){
  if (ev.target.id==='al'){ SH.allergy = ev.target.checked; }
}, false);

document.addEventListener('keydown', function(ev){
  if (ev.key==='Escape' && S.sheet) closeSheet();
}, false);

window.addEventListener('scroll', function(){ syncTabs(); }, { passive:true });

/* ------------------------------------------------------------------ clock */
setInterval(function(){
  var prev = S.now;
  S.now = Date.now();
  var dirty = false;

  for (var k in S.reqs){
    var r = S.reqs[k];
    if (r.state==='sent' && S.now >= r.ackAt){ r.state='ack'; dirty = true; }
    else if (r.state==='ack' && S.now >= r.doneAt){ r.state='done'; dirty = true; }
    else if (r.state==='done' && prev < r.until && S.now >= r.until){ dirty = true; }
  }
  S.portions.forEach(function(p){
    if (p.state==='requested' && S.now >= p.quoteAt){
      var it = ITEM[p.itemId];
      var g = p.grams || 320;
      g = Math.max(100, Math.round((g + (Math.random()*50 - 15)) / 10) * 10);
      p.quoteGrams = g;
      p.quoteAmount = Math.round(g * it.rate / it.basis);
      p.quoteAt = S.now;
      p.state = 'quoted';
      dirty = true;
      toast(t('portQuoteArrived',{name:nameOf(it)}));
    }
  });
  S.rounds.forEach(function(r){
    r.lines.forEach(function(l){
      for (var i=0;i<l.sched.length;i++){
        if (prev < l.sched[i] && S.now >= l.sched[i]) dirty = true;
      }
    });
  });
  if (!dirty && S.screen!=='track' && !(S.sheet && S.sheet.type==='service')) return;

  var ae = document.activeElement;
  if (ae && (ae.tagName==='INPUT' || ae.tagName==='TEXTAREA')) return;
  render();
}, 1000);

render();
})();
</script>
